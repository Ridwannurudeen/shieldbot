<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ShieldBot AI</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    /* Side panel: Ask ShieldBot AI (chat), Guardian (wallet health and alerts) and the injection
       scanner. Tokens in tokens.css. The chat reads as a transcript, each entry labelled with who
       wrote it; scores, addresses and amounts are set in mono. */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--ground);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 13px;
      line-height: 1.5;
      font-synthesis-weight: none;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* Masthead */
    .header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; border-bottom: 1px solid var(--hairline-strong); flex-shrink: 0; }
    .header .logo { display: none; }
    .header h1 { flex: 1; color: var(--ink); font-size: 17px; font-weight: 500; letter-spacing: -0.03em; }
    .header-actions { display: flex; gap: 6px; }
    .header-actions button { height: 28px; padding: 0 10px; border: 1px solid var(--edge); border-radius: 0; background: transparent; color: var(--ink); font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; transition: border-color .15s; }
    .header-actions button:hover { border-color: var(--ink); }

    /* Tabs */
    .tab-bar { display: flex; padding: 0 16px; border-bottom: 1px solid var(--hairline-strong); flex-shrink: 0; }
    .tab-btn { flex: 1; padding: 11px 0 9px; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: transparent; color: var(--secondary); font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; transition: color .15s, border-color .15s; }
    .tab-btn:hover { color: var(--ink); }
    .tab-btn.active { border-bottom-color: var(--accent); color: var(--ink); }
    .panel { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .panel.active { display: flex; }

    /* Transcript */
    #messages { display: flex; flex: 1; flex-direction: column; gap: 14px; overflow-y: auto; padding: 16px; }
    #messages::-webkit-scrollbar, #guardianAlerts::-webkit-scrollbar, #scannerResults::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-thumb, #guardianAlerts::-webkit-scrollbar-thumb, #scannerResults::-webkit-scrollbar-thumb { background: var(--hairline-strong); }
    .chat-bubble { max-width: 100%; font-size: 13.5px; line-height: 1.55; overflow-wrap: anywhere; }
    .chat-bubble.user { align-self: flex-end; max-width: 88%; padding: 9px 12px; border: 1px solid var(--hairline-strong); background: var(--panel); color: var(--ink); white-space: pre-wrap; }
    .chat-bubble.user::before { content: "YOU"; display: block; margin-bottom: 3px; color: var(--secondary); font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; white-space: normal; }
    .bubble-wrapper { position: relative; align-self: stretch; padding-left: 12px; border-left: 2px solid var(--accent); }
    .bubble-wrapper::before { content: "SHIELDBOT AI"; display: block; margin-bottom: 4px; color: var(--accent); font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; }
    .bubble-wrapper .chat-bubble { max-width: 100%; }
    .chat-bubble.assistant { padding-right: 52px; color: var(--ink); }
    .chat-bubble.error { color: var(--ink); }
    .bubble-wrapper:has(.chat-bubble.error) { border-left-color: var(--block-edge); }
    .copy-btn { position: absolute; top: 0; right: 0; height: 22px; padding: 0 7px; border: 1px solid var(--edge); border-radius: 0; background: var(--ground); color: var(--ink); font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; cursor: pointer; opacity: 0; transition: opacity .15s; }
    .bubble-wrapper:hover .copy-btn, .copy-btn:focus-visible { opacity: 1; }
    .retry-btn { display: inline-block; margin-top: 8px; height: 26px; padding: 0 10px; border: 1px solid var(--block-edge); border-radius: 0; background: transparent; color: var(--block-text); font-family: var(--mono); font-size: 11px; cursor: pointer; }
    .chat-bubble.typing { display: flex; align-items: center; gap: 8px; align-self: stretch; padding: 2px 0 2px 12px; border-left: 2px solid var(--accent); }
    .typing-dots { display: flex; gap: 3px; }
    .typing-dot { width: 5px; height: 5px; background: var(--accent); animation: typingPulse 1.2s ease-in-out infinite; }
    .typing-dot:nth-child(2) { animation-delay: .15s; }
    .typing-dot:nth-child(3) { animation-delay: .3s; }
    .typing-label { color: var(--secondary); font-size: 12px; }
    @keyframes typingPulse { 50% { opacity: .3; } }

    /* Suggested questions: a list, not chips */
    .suggested-prompts { display: flex; flex-direction: column; margin-top: auto; }
    .suggested-prompts::before { content: "Ask about a token, a contract or a threat. Paste an address to scan it."; padding-bottom: 16px; border-bottom: 1px solid var(--hairline-strong); color: var(--ink); font-size: 20px; font-weight: 500; line-height: 1.3; letter-spacing: -0.02em; }
    .prompt-chip { display: flex; align-items: center; justify-content: space-between; height: 42px; padding: 0 2px; border: 0; border-bottom: 1px solid var(--hairline-strong); background: transparent; color: var(--ink); font-size: 13px; text-align: left; cursor: pointer; transition: color .15s; }
    .prompt-chip::after { content: "\2192"; color: var(--secondary); font-family: var(--mono); }
    .prompt-chip:hover { color: var(--accent); }
    .prompt-chip:hover::after { color: var(--accent); }

    /* Markdown inside a reply */
    .chat-bubble.assistant p { margin-bottom: 8px; }
    .chat-bubble.assistant p:last-child { margin-bottom: 0; }
    .md-codeblock, .md-code { background: var(--panel); color: var(--ink); font-family: var(--mono); font-size: 12px; }
    .md-codeblock { display: block; overflow-x: auto; margin: 6px 0; padding: 8px 10px; border-left: 2px solid var(--hairline-strong); white-space: pre-wrap; }
    .md-code { padding: 1px 4px; }
    .md-list { margin: 4px 0; padding-left: 18px; }
    .md-list li { margin-bottom: 2px; }
    .md-link { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
    .chat-bubble.assistant strong { color: var(--ink); font-weight: 500; }
    .chat-bubble.assistant em { color: var(--secondary); }

    /* Risk card: a scan the reply carried */
    .risk-card { align-self: stretch; padding: 12px; border: 1px solid var(--hairline-strong); background: var(--ground-alt); }
    .risk-card-header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 8px; }
    .risk-score-badge { order: 1; margin-left: auto; color: var(--ink); font-family: var(--mono); font-size: 18px; font-variant-numeric: tabular-nums; }
    .risk-card-title { order: 0; max-width: 100%; padding: 3px 8px; border: 1px solid var(--edge); font-family: var(--mono); font-size: 11.5px; overflow-wrap: anywhere; }
    .risk-card:has(.risk-score-badge.high) .risk-card-title { border: 2px solid var(--block-edge); color: var(--block-text); }
    .risk-card:has(.risk-score-badge.high) .risk-card-title::before { content: "! "; }
    .risk-card:has(.risk-score-badge.medium) .risk-card-title { border-color: var(--edge); color: var(--ink); }
    .risk-card:has(.risk-score-badge.medium) .risk-card-title::before { content: "! "; }
    .risk-card:has(.risk-score-badge.low) .risk-card-title { border-color: var(--safe); color: var(--safe-text); }
    .risk-card:has(.risk-score-badge.unknown) .risk-card-title { border: 1px dashed var(--on-unknown); background: var(--unknown); color: var(--on-unknown); }
    .risk-card:has(.risk-score-badge.unknown) .risk-card-title::before { content: "? "; }
    .risk-card-subtitle { margin-top: 3px; color: var(--secondary); font-size: 12px; }
    .risk-flag { display: inline-block; margin: 2px 4px 2px 0; padding: 1px 7px; border: 1px solid var(--block-edge); color: var(--block-text); font-size: 11.5px; }
    .risk-card-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--hairline-strong); color: var(--secondary); font-family: var(--mono); font-size: 11px; }
    .risk-card-meta span { color: var(--ink); }

    /* Composer */
    .input-area { display: flex; align-items: stretch; gap: 8px; padding: 12px 16px 14px; border-top: 1px solid var(--hairline-strong); flex-shrink: 0; }
    #chainSelect, #chatInput, #injectionInput { min-width: 0; border: 1px solid var(--edge); border-radius: 0; background: var(--ground-alt); color: var(--ink); outline: none; }
    #chainSelect { flex-shrink: 0; width: 92px; padding: 0 6px; font-family: var(--mono); font-size: 11.5px; cursor: pointer; }
    #chainSelect option { background: var(--ground-alt); color: var(--ink); }
    #chainSelect:focus, #chatInput:focus, #injectionInput:focus { border-color: var(--accent); }
    #chatInput { flex: 1; height: 40px; padding: 0 12px; font-size: 13px; }
    #chatInput::placeholder, #injectionInput::placeholder { color: var(--secondary); opacity: 1; }
    #sendBtn, #scanInjectionBtn { height: 40px; padding: 0 16px; border: 1px solid var(--accent); border-radius: 0; background: var(--accent-fill); color: var(--on-accent); font-size: 13px; font-weight: 500; cursor: pointer; transition: background-color .15s; }
    #sendBtn:hover, #scanInjectionBtn:hover { background: var(--accent-fill-hover); }
    #refreshAlertsBtn { height: 38px; padding: 0 14px; border: 1px solid var(--edge); border-radius: 0; background: transparent; color: var(--ink); font-size: 13px; font-weight: 500; cursor: pointer; }
    #refreshAlertsBtn:hover { border-color: var(--ink); }
    #sendBtn:disabled, #refreshAlertsBtn:disabled, #scanInjectionBtn:disabled { border-color: var(--hairline-strong); background: var(--panel); color: var(--secondary); cursor: not-allowed; }
    #sendBtn { flex-shrink: 0; }

    /* Guardian */
    #guardianHealth { padding: 16px 16px 0; flex-shrink: 0; }
    .health-card { border: 1px solid var(--hairline-strong); background: var(--ground-alt); }
    .health-header { display: flex; align-items: center; justify-content: space-between; padding: 14px; border-bottom: 1px solid var(--hairline-strong); }
    .health-header::before { content: "WALLET HEALTH"; color: var(--secondary); font-family: var(--mono); font-size: 11px; letter-spacing: .1em; }
    .health-score { order: 1; margin-left: auto; margin-right: 12px; font-family: var(--mono); font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
    .health-level { order: 2; padding: 3px 8px; border: 1px solid transparent; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
    .health-level.excellent, .health-level.good { border-color: var(--safe); color: var(--safe-text); }
    .health-level.fair { border-color: var(--edge); color: var(--ink); }
    .health-level.poor, .health-level.critical { border: 2px solid var(--block-edge); color: var(--block-text); }
    .health-level.unknown { border: 1px dashed var(--on-unknown); background: var(--unknown); color: var(--on-unknown); }
    .health-level.fair::before, .health-level.poor::before, .health-level.critical::before { content: "! "; }
    .health-level.unknown::before { content: "? "; }
    .health-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid var(--hairline-strong); }
    .health-stat { display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; }
    .health-stat + .health-stat { border-left: 1px solid var(--hairline-strong); }
    .health-stat-val { color: var(--ink); font-family: var(--mono); font-size: 17px; font-variant-numeric: tabular-nums; }
    .health-stat-label { color: var(--secondary); font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; }
    .health-components { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; padding: 8px 14px 10px; color: var(--secondary); font-size: 12px; }
    .health-component { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--hairline); }
    .health-component span:last-child { color: var(--ink); font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .health-warnings { margin: 0 14px 14px; padding: 8px 10px; border-left: 2px solid var(--edge); background: var(--panel); color: var(--ink); font-size: 12px; }
    #guardianAlerts { display: flex; flex: 1; flex-direction: column; overflow-y: auto; padding: 14px 16px 16px; }
    #guardianAlerts::before { content: "ALERTS"; padding-bottom: 8px; border-bottom: 1px solid var(--hairline-strong); color: var(--secondary); font-family: var(--mono); font-size: 11px; letter-spacing: .1em; }
    .guardian-toolbar { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px 14px; border-top: 1px solid var(--hairline-strong); flex-shrink: 0; }
    .alert-card { display: flow-root; padding: 10px 0; border-bottom: 1px solid var(--hairline-strong); }
    .alert-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .severity-badge { flex-shrink: 0; min-width: 64px; padding: 2px 6px; border: 1px solid transparent; color: var(--ink); font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-align: center; text-transform: uppercase; }
    .severity-badge.critical, .severity-badge.high { border: 2px solid var(--block-edge); color: var(--block-text); }
    .severity-badge.medium { border-color: var(--edge); color: var(--ink); }
    .severity-badge.low { border-color: var(--hairline-strong); color: var(--secondary); }
    .severity-badge.info { border-color: var(--hairline-strong); color: var(--ink); }
    .severity-badge.critical::before, .severity-badge.high::before, .severity-badge.medium::before { content: "! "; }
    .alert-card-title { color: var(--ink); font-size: 13px; font-weight: 500; }
    .alert-card-wallet, .alert-card-time { color: var(--secondary); font-family: var(--mono); font-size: 11px; }
    .alert-card-wallet { display: inline-block; margin-top: 6px; }
    .ack-btn { float: right; height: 26px; padding: 0 10px; border: 1px solid var(--edge); border-radius: 0; background: transparent; color: var(--ink); font-family: var(--mono); font-size: 11px; cursor: pointer; }
    .ack-btn:hover { border-color: var(--ink); }
    .placeholder-msg { padding: 32px 8px; color: var(--secondary); font-size: 13px; text-align: center; }
    .placeholder-msg a { color: var(--accent); text-decoration: underline; cursor: pointer; }

    /* Scanner */
    #scannerPanel .scanner-input-area { display: flex; flex-direction: column; gap: 10px; padding: 16px; flex-shrink: 0; }
    #injectionInput { width: 100%; min-height: 120px; padding: 10px 12px; font-family: var(--mono); font-size: 12px; line-height: 1.5; resize: vertical; }
    #scanInjectionBtn { align-self: flex-end; }
    #scannerResults { display: flex; flex: 1; flex-direction: column; overflow-y: auto; padding: 0 16px 16px; }
    .scan-result-card { padding: 12px 0; border-top: 1px solid var(--hairline-strong); }
    .scan-result-header { display: flex; align-items: flex-start; gap: 12px; }
    .scan-score-badge { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; width: 30px; height: 30px; border: 1px solid var(--edge); color: var(--ink); font-family: var(--mono); font-size: 14px; }
    .scan-score-badge.danger { border: 2px solid var(--block-edge); color: var(--block-text); }
    .scan-score-badge.neutral { border-color: var(--edge); color: var(--ink); }
    .scan-score-badge.unknown { border: 1px dashed var(--on-unknown); background: var(--unknown); color: var(--on-unknown); }
    .scan-result-label { color: var(--ink); font-size: 13px; font-weight: 500; }
    .scan-result-sublabel { margin-top: 2px; color: var(--secondary); font-size: 12px; }
    .pattern-list { display: flex; flex-wrap: wrap; gap: 4px; margin: 10px 0 0 42px; padding: 0; list-style: none; }
    .pattern-tag { display: inline-block; padding: 1px 7px; border: 1px solid var(--edge); color: var(--ink); font-family: var(--mono); font-size: 11px; }

    @media (prefers-reduced-motion: reduce) {
      .typing-dot { animation: none; }
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo"></div>
    <h1>ShieldBot AI</h1>
    <div class="header-actions">
      <button id="exportBtn">Export</button>
      <button id="clearBtn">Clear</button>
    </div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" data-tab="chat">Chat</button>
    <button class="tab-btn" data-tab="guardian">Guardian</button>
    <button class="tab-btn" data-tab="scanner">Scanner</button>
  </div>

  <!-- Chat Panel -->
  <div id="chatPanel" class="panel active">
    <div id="messages" aria-live="polite"></div>
    <div class="input-area">
      <select id="chainSelect" aria-label="Chain">
        <option value="56">BSC</option>
        <option value="1">ETH</option>
        <option value="8453">Base</option>
        <option value="42161">Arb</option>
        <option value="137">Poly</option>
        <option value="204">opBNB</option>
        <option value="10">OP</option>
        <option value="4663">Robinhood</option>
      </select>
      <input type="text" id="chatInput" aria-label="Message" placeholder="Ask about a token, contract, or threat...">
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <!-- Guardian Panel -->
  <div id="guardianPanel" class="panel">
    <div id="guardianHealth"></div>
    <div id="guardianAlerts"></div>
    <div class="guardian-toolbar">
      <button id="refreshAlertsBtn">Refresh</button>
    </div>
  </div>

  <!-- Scanner Panel -->
  <div id="scannerPanel" class="panel">
    <div class="scanner-input-area">
      <textarea id="injectionInput" aria-label="Text to scan" placeholder="Paste agent prompt, message, or tool input to scan for injection attacks..."></textarea>
      <button id="scanInjectionBtn">Scan for Injection</button>
    </div>
    <div id="scannerResults"></div>
  </div>

  <script src="i18n.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
