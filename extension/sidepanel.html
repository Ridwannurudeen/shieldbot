<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      color-scheme: light;
      --paper: #FFFFFF;
      --panel: #F7F6F2;
      --ink: #141414;
      --muted: #6B6B66;
      --line: #E6E5E1;
      --accent: #A3168F;
      --accent-hover: #8A1279;
      --safe: #176E48;
      --caution: #141414;
      --high: #C21F30;
      --block: #C21F30;
      --unknown: #141414;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.45;
    }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    .header { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--paper); flex-shrink: 0; }
    .header .logo { display: none; }
    .header h1 { flex: 1; color: var(--ink); font-size: 14px; font-weight: 500; }
    .header-actions { display: flex; gap: 6px; }
    .header-actions button { padding: 4px 10px; border: 1px solid var(--line); border-radius: 5px; background: var(--paper); color: var(--muted); font-size: 11px; cursor: pointer; transition: border-color .15s, color .15s; }
    #clearBtn:hover { border-color: var(--ink); color: var(--ink); }
    #exportBtn:hover { border-color: var(--accent); color: var(--accent); }
    #messages { display: flex; flex: 1; flex-direction: column; gap: 10px; overflow-y: auto; padding: 16px; background: var(--paper); }
    #messages::-webkit-scrollbar, #guardianAlerts::-webkit-scrollbar, #scannerResults::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-thumb, #guardianAlerts::-webkit-scrollbar-thumb, #scannerResults::-webkit-scrollbar-thumb { border-radius: 2px; background: #D7D6D0; }
    .chat-bubble { max-width: 85%; padding: 10px 14px; border: 1px solid var(--line); border-radius: 7px; font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
    .chat-bubble.user { align-self: flex-end; border-bottom-right-radius: 3px; background: var(--panel); color: var(--ink); white-space: pre-wrap; }
    .chat-bubble.assistant { align-self: flex-start; border-bottom-left-radius: 3px; background: var(--paper); color: var(--ink); }
    .chat-bubble.error { border-color: var(--block); }
    .bubble-wrapper { position: relative; align-self: flex-start; max-width: 85%; }
    .bubble-wrapper .chat-bubble { max-width: 100%; }
    .copy-btn { position: absolute; top: 6px; right: 6px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); color: var(--muted); font-size: 10px; cursor: pointer; opacity: 0; transition: opacity .15s; }
    .bubble-wrapper:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
    .retry-btn { display: inline-block; margin-top: 6px; padding: 3px 10px; border: 1px solid var(--block); border-radius: 4px; background: var(--paper); color: var(--block); font-size: 11px; cursor: pointer; }
    .chat-bubble.typing { display: flex; align-items: center; gap: 6px; padding: 10px 14px; background: var(--panel); }
    .typing-dots { display: flex; gap: 3px; }
    .typing-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: typingPulse 1.4s ease-in-out infinite; }
    .typing-dot:nth-child(2) { animation-delay: .2s; }
    .typing-dot:nth-child(3) { animation-delay: .4s; }
    .typing-label { color: var(--muted); font-size: 12px; }
    @keyframes typingPulse { 0%, 80%, 100% { transform: scale(.6); opacity: .3; } 40% { transform: scale(1); opacity: 1; } }
    .suggested-prompts { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 16px; }
    .prompt-chip { padding: 8px 14px; border: 1px solid var(--line); border-radius: 20px; background: var(--panel); color: var(--muted); font-size: 12px; cursor: pointer; transition: border-color .15s, color .15s; }
    .prompt-chip:hover { border-color: var(--accent); color: var(--accent); }
    .chat-bubble.assistant p { margin-bottom: 6px; }
    .chat-bubble.assistant p:last-child { margin-bottom: 0; }
    .md-codeblock, .md-code { border-radius: 4px; background: var(--panel); color: var(--ink); font-family: 'Consolas', 'Monaco', monospace; font-size: 12px; }
    .md-codeblock { display: block; overflow-x: auto; margin: 6px 0; padding: 8px 10px; white-space: pre-wrap; }
    .md-code { padding: 1px 5px; }
    .md-list { margin: 4px 0; padding-left: 18px; }
    .md-list li { margin-bottom: 2px; }
    .md-link { color: var(--accent); text-decoration: underline; }
    .chat-bubble.assistant strong { color: var(--ink); }
    .chat-bubble.assistant em { color: var(--muted); }
    .risk-card { align-self: flex-start; max-width: 85%; margin-bottom: 6px; padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); }
    .risk-card-header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
    .risk-score-badge { order: 1; width: auto; height: auto; padding: 0; border: 0; border-radius: 0; background: transparent !important; color: var(--muted) !important; font-size: 12px; font-weight: 500; }
    .risk-card-title { order: 0; max-width: 100%; padding: 3px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--ink); font-size: 12px; font-weight: 500; overflow-wrap: anywhere; }
    .risk-card:has(.risk-score-badge.high) .risk-card-title { border: 2px solid #C21F30; background: transparent; color: #C21F30; }
    .risk-card:has(.risk-score-badge.high) .risk-card-title::before { content: "! "; }
    .risk-card:has(.risk-score-badge.medium) .risk-card-title { border-color: #8B8B86; background: transparent; color: #141414; }
    .risk-card:has(.risk-score-badge.medium) .risk-card-title::before { content: "! "; }
    .risk-card:has(.risk-score-badge.low) .risk-card-title { padding: 3px 0; border: 0; background: transparent; color: var(--ink); }
    .risk-card:has(.risk-score-badge.unknown) .risk-card-title { border: 1px dashed #141414; background: #8B8B86; color: #141414; }
    .risk-card:has(.risk-score-badge.unknown) .risk-card-title::before { content: "? "; }
    .risk-card-subtitle { margin-top: 1px; color: var(--muted); font-size: 11px; }
    .risk-flag { display: inline-block; margin: 2px 2px 2px 0; padding: 2px 8px; border: 1px solid #E9C5C8; border-radius: 4px; background: #FBEDEF; color: var(--block); font-size: 11px; }
    .risk-card-meta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; color: var(--muted); font-size: 11px; }
    .risk-card-meta span { color: var(--muted); }
    .input-area { display: flex; align-items: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--paper); flex-shrink: 0; }
    #chainSelect, #chatInput, #injectionInput { min-width: 0; padding: 8px 9px; border: 1px solid var(--line); border-radius: 5px; background: var(--paper); color: var(--ink); font-size: 12px; outline: none; }
    #chainSelect { flex-shrink: 0; cursor: pointer; }
    #chainSelect:focus, #chatInput:focus, #injectionInput:focus { border-color: var(--accent); }
    #chatInput { flex: 1; padding: 10px 12px; font-size: 13px; }
    #chatInput::placeholder, #injectionInput::placeholder { color: var(--muted); opacity: 1; }
    #sendBtn, #refreshAlertsBtn, #scanInjectionBtn { padding: 10px 14px; border: 0; border-radius: 5px; background: var(--accent); color: #FFFFFF; font-size: 12px; font-weight: 600; cursor: pointer; transition: background .15s; }
    #sendBtn:hover, #refreshAlertsBtn:hover, #scanInjectionBtn:hover { background: var(--accent-hover); }
    #sendBtn:disabled, #refreshAlertsBtn:disabled, #scanInjectionBtn:disabled { background: var(--line); color: var(--unknown); cursor: not-allowed; }
    #sendBtn { flex-shrink: 0; }
    .tab-bar { display: flex; border-bottom: 1px solid var(--line); background: var(--paper); flex-shrink: 0; }
    .tab-btn { flex: 1; padding: 10px 0; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); font-size: 12px; font-weight: 500; cursor: pointer; text-align: center; transition: color .15s, border-color .15s; }
    .tab-btn:hover { color: var(--ink); }
    .tab-btn.active { border-bottom-color: var(--accent); color: var(--accent); }
    .panel { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .panel.active { display: flex; }
    #guardianHealth { padding: 16px; flex-shrink: 0; }
    .health-card { padding: 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); }
    .health-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .health-score { color: var(--ink) !important; font-size: 28px; font-weight: 500; }
    .health-level { padding: 3px 8px; border: 1px solid transparent; border-radius: 4px; font-size: 12px; font-weight: 500; letter-spacing: .02em; text-transform: uppercase; }
    .health-level.excellent, .health-level.good { border-color: #176E48; background: transparent; color: #176E48; }
    .health-level.fair { border-color: #8B8B86; background: transparent; color: #141414; }
    .health-level.poor, .health-level.critical { border: 2px solid #C21F30; background: transparent; color: #C21F30; }
    .health-level.unknown { border: 1px dashed #141414; background: #8B8B86; color: #141414; }
    .health-level.fair::before, .health-level.poor::before, .health-level.critical::before { content: "! "; }
    .health-level.unknown::before { content: "? "; }
    .health-stats { display: flex; justify-content: space-around; margin-bottom: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .health-stat { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .health-stat-val { color: var(--ink) !important; font-size: 18px; font-weight: 500; }
    .health-stat-label { color: var(--muted); font-size: 11px; letter-spacing: .02em; text-transform: uppercase; }
    .health-components { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; color: var(--muted); font-size: 11px; }
    .health-component { display: flex; justify-content: space-between; gap: 8px; }
    .health-warnings { margin-top: 8px; padding: 8px; border: 1px solid #E8DDB8; border-radius: 4px; background: #FBF5E5; color: var(--caution); font-size: 11px; }
    #guardianAlerts { display: flex; flex: 1; flex-direction: column; gap: 10px; overflow-y: auto; padding: 0 16px 16px; }
    .guardian-toolbar { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--paper); flex-shrink: 0; }
    #refreshAlertsBtn { flex: 1; }
    .alert-card { padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); }
    .alert-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .severity-badge { flex-shrink: 0; padding: 2px 8px; border: 1px solid transparent; border-radius: 4px; color: var(--ink); font-size: 11px; font-weight: 600; text-transform: uppercase; }
    .severity-badge.critical, .severity-badge.high { border: 2px solid #C21F30; background: transparent; color: #C21F30; }
    .severity-badge.medium { border-color: #8B8B86; background: transparent; color: #141414; }
    .severity-badge.low { padding: 2px 0; border: 0; background: transparent; color: var(--ink); }
    .severity-badge.info { border-color: var(--line); background: transparent; color: var(--ink); }
    .severity-badge.critical::before, .severity-badge.high::before, .severity-badge.medium::before { content: "! "; }
    .alert-card-title { color: var(--ink); font-size: 13px; font-weight: 500; }
    .alert-card-wallet, .alert-card-time { color: var(--muted); font-size: 11px; }
    .alert-card-wallet { margin-bottom: 8px; }
    .ack-btn { float: right; padding: 4px 12px; border: 1px solid var(--line); border-radius: 5px; background: var(--paper); color: var(--muted); font-size: 11px; cursor: pointer; }
    .ack-btn:hover { border-color: var(--accent); color: var(--accent); }
    .placeholder-msg { padding: 40px 16px; color: var(--muted); font-size: 13px; text-align: center; }
    .placeholder-msg a { color: var(--accent); text-decoration: underline; cursor: pointer; }
    #scannerPanel .scanner-input-area { display: flex; flex-direction: column; gap: 10px; padding: 16px; flex-shrink: 0; }
    #injectionInput { width: 100%; min-height: 100px; font-size: 13px; resize: vertical; }
    #scanInjectionBtn { align-self: flex-end; }
    #scannerResults { display: flex; flex: 1; flex-direction: column; gap: 10px; overflow-y: auto; padding: 0 16px 16px; }
    .scan-result-card { padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); }
    .scan-result-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .scan-score-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 34px; height: 34px; padding: 0 6px; border: 1px solid var(--line); border-radius: 50%; background: var(--panel); color: var(--ink); font-size: 13px; font-weight: 500; flex-shrink: 0; }
    .scan-score-badge.danger { border: 2px solid #C21F30; border-radius: 4px; background: transparent; color: #C21F30; }
    .scan-score-badge.neutral { border-color: #8B8B86; background: transparent; color: #141414; }
    .scan-score-badge.unknown { border: 1px dashed #141414; background: #8B8B86; color: #141414; }
    .scan-result-label { color: var(--ink); font-size: 13px; font-weight: 500; }
    .scan-result-sublabel { margin-top: 1px; color: var(--muted); font-size: 11px; }
    .pattern-list { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 0; padding: 0; list-style: none; }
    .pattern-tag { display: inline-block; padding: 2px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--unknown); font-size: 11px; }
    @media (prefers-reduced-motion: reduce) {
      .typing-dot { animation: none; }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo"></div>
    <h1>ShieldAI</h1>
    <div class="header-actions">
      <button id="exportBtn">Export</button>
      <button id="clearBtn">Clear</button>
    </div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" data-tab="chat">Chat</button>
    <button class="tab-btn" data-tab="guardian">Guardian</button>
    <button class="tab-btn" data-tab="scanner">Scanner</button>
  </div>

  <!-- Chat Panel -->
  <div id="chatPanel" class="panel active">
    <div id="messages"></div>
    <div class="input-area">
      <select id="chainSelect" aria-label="Chain">
        <option value="56">BSC</option>
        <option value="1">ETH</option>
        <option value="8453">Base</option>
        <option value="42161">Arb</option>
        <option value="137">Poly</option>
        <option value="204">opBNB</option>
        <option value="10">OP</option>
        <option value="4663">Robinhood</option>
      </select>
      <input type="text" id="chatInput" placeholder="Ask about a token, contract, or threat...">
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <!-- Guardian Panel -->
  <div id="guardianPanel" class="panel">
    <div id="guardianHealth"></div>
    <div id="guardianAlerts"></div>
    <div class="guardian-toolbar">
      <button id="refreshAlertsBtn">Refresh</button>
    </div>
  </div>

  <!-- Scanner Panel -->
  <div id="scannerPanel" class="panel">
    <div class="scanner-input-area">
      <textarea id="injectionInput" placeholder="Paste agent prompt, message, or tool input to scan for injection attacks..."></textarea>
      <button id="scanInjectionBtn">Scan for Injection</button>
    </div>
    <div id="scannerResults"></div>
  </div>

  <script src="i18n.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
