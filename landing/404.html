    @font-face {
      font-family: "Geist";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("/fonts/geist-latin-400-normal.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: "Geist";
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url("/fonts/geist-latin-500-normal.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: "IBM Plex Mono";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: "Geist Fallback";
      src: local("Arial");
      size-adjust: 134.8%;
      ascent-override: 74.56%;
      descent-override: 21.88%;
      line-gap-override: 0%;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      min-width: 320px;
      margin: 0;
      background: var(--ground);
      color: var(--ink);
      font: 400 16px/1.65 "Geist", "Geist Fallback", Arial, Helvetica, sans-serif;
      text-rendering: optimizeLegibility;
    }
    a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
    a:hover { color: var(--ink); }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .site-nav { border-bottom: 1px solid var(--hairline-strong); background: var(--ground-alt); }
    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 24px;
      width: calc(100% - 32px);
      max-width: 1152px;
      min-height: 64px;
      margin: 0 auto;
    }
    .nav-links { display: flex; flex-wrap: nowrap; justify-content: flex-end; align-items: center; gap: 4px 24px; }
    .nav-links a { display: inline-flex; align-items: center; min-height: 44px; color: var(--ink); font-size: 15px; text-decoration: none; }
    .theme-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
    }
    .theme-toggle:hover { background: var(--ground-alt); }
    .theme-icon-moon { display: none; }
    :root[data-theme="light"] .theme-icon-sun { display: none; }
    :root[data-theme="light"] .theme-icon-moon { display: block; }
    main {
      width: calc(100% - 32px);
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 0 88px;
    }
    main h1 { margin: 0; font-size: 32px; font-weight: 500; line-height: 1.15; letter-spacing: -0.03em; }
    .footer { border-top: 1px solid var(--hairline-strong); background: var(--ground-alt); }
    .footer-inner { width: calc(100% - 32px); max-width: 1152px; margin: 0 auto; padding: 24px 0; }
    .footer-links { display: flex; flex-wrap: wrap; gap: 8px 24px; }
    .footer-links a { display: inline-flex; align-items: center; min-height: 40px; color: var(--ink); font-size: 14px; text-decoration: none; }
    .footer-links a:hover { color: var(--accent); }
    @media (max-width: 600px) {
      main { padding: 36px 0 64px; }
      .nav-inner { gap: 12px; }
      .nav-links { gap: 4px 14px; }
      .nav-links a { font-size: 14px; }
    }
  </style>
    <script src="/js/plausible-init.js"></script>
    <script async src="/js/script.js"></script>
    <script src="/js/theme-toggle.js" defer></script>
</head>

</body>
</html>
