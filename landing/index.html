    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is ShieldBot?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ShieldBot is a transaction security tool for EVM chains. Its browser extension, listed on the Chrome Web Store as ShieldAI Transaction Firewall, checks transactions before you sign them. The Telegram bot, API and MCP server scan contracts and tokens on 8 chains, including Robinhood Chain."
          }
        },
        {
          "@type": "Question",
          "name": "How does ShieldBot detect rug pulls and scams?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It combines contract code checks (including bytecode patterns for unverified contracts), market and liquidity data, on-chain reputation, a buy and sell simulation that catches honeypots, and scam databases. Optional AI analysis adds a written summary. If one of these checks cannot run, the result says Unknown instead of Safe."
          }
        },
        {
          "@type": "Question",
          "name": "Which blockchains does ShieldBot support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "BNB Chain, opBNB, Ethereum, Base, Arbitrum, Polygon, Optimism and Robinhood Chain. Contract scans work on all 8. Mempool monitoring covers the 7 chains with a public mempool; Robinhood Chain has none, so ShieldBot scans new Robinhood Chain launches instead. Coverage depends on each chain's data providers, and missing data is reported as Unknown."
          }
        },
        {
          "@type": "Question",
          "name": "What does ShieldBot do on Robinhood Chain?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It scans Robinhood Chain tokens, including a buy and sell simulation on supported pool routes, finds new launches and sends launch alerts in Telegram. An on-chain verdict registry and a freshness guard for Robinhood Chain are built and tested, and their deployment is in progress. The released browser extension does not cover Robinhood Chain yet."
          }
        },
        {
          "@type": "Question",
          "name": "Is ShieldBot free to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The Chrome extension and the Telegram bot are free to install and use, and neither needs an account."
          }
        },
        {
          "@type": "Question",
          "name": "What is the safety score?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The extension shows a safety score out of 100, where higher is safer. It is 100 minus ShieldBot's risk score. 70 or above is SAFE, 51 to 69 is CAUTION, 30 to 50 is HIGH RISK, and 29 or below is BLOCK RECOMMENDED. If a check could not run, the score shows as Unknown instead of a number."
          }
        },
        {
          "@type": "Question",
          "name": "How do I install ShieldBot?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Install the extension from the Chrome Web Store, where it is listed as ShieldAI Transaction Firewall. It is free and needs no account. You can also use the Telegram bot at t.me/shieldbot_bnb_bot: send a contract address to get a risk report."
          }
        }
      ]
    }
