<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="theme-color" content="#0B0B0A" />
  <meta charset="UTF-8" />
  <!-- theme.js -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShieldBot Threat Dashboard</title>
  <meta name="description" content="ShieldBot's public threat dashboard: the token launches blocked on Robinhood Chain with their published verdicts, how often each data provider answered, the newest firewall detections and mempool alerts, and the window each count covers." />
  <meta name="color-scheme" content="dark light" />
  <link rel="canonical" href="https://api.shieldbotsecurity.online/dashboard" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iNiIgZmlsbD0iIzBCMEIwQSIvPjxwYXRoIGQ9Ik0xNiA0IDI2IDh2N2MwIDYtNC40IDEwLjctMTAgMTMtNS42LTIuMy0xMC03LTEwLTEzVjhsMTAtNFoiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI0Y3RjZGMiIgc3Ryb2tlLXdpZHRoPSIyIiBzdHJva2UtbGluZWpvaW49InJvdW5kIi8+PHBhdGggZD0ibTExIDE2IDMuMiAzLjJMMjEgMTIiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI0Y3RjZGMiIgc3Ryb2tlLXdpZHRoPSIyIiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiLz48L3N2Zz4=" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Geist', 'system-ui', 'sans-serif'],
            mono: ['IBM Plex Mono', 'monospace'],
          },
        },
      },
    };
  </script>

  <!-- React + ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- prop-types (required by Recharts UMD) -->
  <script src="https://unpkg.com/prop-types@15/prop-types.min.js" crossorigin></script>

  <!-- Recharts -->
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js" crossorigin></script>

  <!-- Babel (JSX in browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --ground: #0B0B0A;
      --ground-alt: #171716;
      --panel: #1F1F1E;
      --ink: #F7F6F2;
      --on-ink: #0B0B0A;
      --secondary: #A3A39E;
      --hairline: #232322;
      --hairline-strong: #343433;
      --edge: #767671;
      --accent: #EA66D8;
      --accent-fill: #A3168F;
      --accent-fill-hover: #8A1279;
      --on-accent: #FFFFFF;
      --accent-tint: #2B1227;
      --on-panel: #F7F6F2;
      --on-panel-2: #A3A39E;
      --accent-on-panel: #EA66D8;
      --block-on-panel: #F0756A;
      --paper: #FFFFFF;
      --on-paper: #141414;
      --on-paper-2: #6B6B66;
      --focus: #EA66D8;
      --block: #C21F30;
      --block-edge: #E04556;
      --block-text: #F0756A;
      --safe: #2DB47C;
      --safe-text: #4FCF95;
      --unknown: #8B8B86;
      --on-unknown: #141414;
      --block-on-paper: #A81A29;
      --shadow: #000000;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --ground: #FFFFFF;
      --ground-alt: #F7F6F2;
      --panel: #141414;
      --ink: #141414;
      --on-ink: #FFFFFF;
      --secondary: #6B6B66;
      --hairline: #E6E5E1;
      --hairline-strong: #D6D5D0;
      --edge: #8B8B86;
      --accent: #A3168F;
      --accent-fill: #A3168F;
      --accent-fill-hover: #8A1279;
      --on-accent: #FFFFFF;
      --accent-tint: #FBEFF9;
      --on-panel: #F7F6F2;
      --on-panel-2: #8B8B86;
      --accent-on-panel: #EA66D8;
      --block-on-panel: #F0756A;
      --paper: #FFFFFF;
      --on-paper: #141414;
      --on-paper-2: #6B6B66;
      --focus: #A3168F;
      --block: #C21F30;
      --block-edge: #C21F30;
      --block-text: #A81A29;
      --safe: #1D8A5A;
      --safe-text: #176E48;
      --unknown: #8B8B86;
      --on-unknown: #141414;
      --block-on-paper: #A81A29;
      --shadow: #141414;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--ground);
      font-family: 'Geist', system-ui, sans-serif;
      color: var(--ink);
      min-height: 100vh;
    }

    /* Toast slide-in */
    @keyframes slideInRight {
      from { transform: translateX(110%); opacity: 0; }
      to   { transform: translateX(0);   opacity: 1; }
    }
    .toast-anim { animation: slideInRight 0.25s ease; }

    /* Fade in */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.2s ease both; }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .toast-anim  { animation: none; }
      .fade-up     { animation: none; }
      *, *::before, *::after { transition: none !important; }
    }

    .theme-switch {
      display:grid; width:36px; height:36px; place-items:center; padding:0;
      border:1px solid transparent; border-radius:8px; background:transparent; color:var(--ink); cursor:pointer;
    }
    .theme-switch:hover { background:var(--ground-alt); }
    .theme-switch svg { width:16px; height:16px; }

    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--ground-alt); }
    ::-webkit-scrollbar-thumb { background: var(--hairline-strong); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--edge); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo, useRef } = React;
    const {
      AreaChart, Area, BarChart, Bar, Cell,
      XAxis, YAxis, CartesianGrid, Tooltip,
      ResponsiveContainer,
    } = Recharts;

    // ─── Constants ────────────────────────────────────────────────────────────
    const API              = window.location.origin;
    const REFRESH_MS       = 20000;
    // Items requested from each threat feed source; a source that returns this many may hold more.
    const FEED_LIMIT       = 100;
    // The chain launch discovery runs on (services/launch_discovery.py) and how many of its blocked
    // launches the Robinhood Chain panel requests.
    const LAUNCH_CHAIN     = 4663;
    const LAUNCH_LIMIT     = 20;
    // How many loaded blocked launches show before the reader asks for the rest.
    const LAUNCH_VISIBLE   = 5;
    // The ShieldBotVerdictRegistry on Robinhood Chain (docs/DEPLOYMENTS.md), where a confirmed record is read.
    const REGISTRY_ADDRESS = '0xB7cfB87579f232dBa70CDC8Ba063AA7b500D5138';
    // Blocked launches accumulate over days and campaigns are a slow-moving aggregate, and every request
    // counts against one per-IP limit, so both refresh on their own slower cycle: the fast cycle sends
    // four requests every 20 s (12 a minute) and this one two every 5 min (0.4 a minute).
    const SLOW_REFRESH_MS  = 300000;
    // With reduced motion, counts show their value at once, the live dot does not pulse and charts do not animate.
    const REDUCED_MOTION   = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Mirrors utils/chain_info.py.
    const CHAIN_NAMES  = { 56:'BNB', 1:'ETH', 8453:'Base', 42161:'ARB', 137:'Polygon', 10:'OP', 204:'opBNB', 4663:'Robinhood' };
    const CHAIN_COLORS = { 56:'secondary', 1:'secondary', 8453:'secondary', 42161:'secondary', 137:'secondary', 10:'secondary', 204:'secondary', 4663:'secondary' };
    const EXPLORERS    = { 56:'https://bscscan.com', 1:'https://etherscan.io', 8453:'https://basescan.org', 42161:'https://arbiscan.io', 137:'https://polygonscan.com', 10:'https://optimistic.etherscan.io', 204:'https://opbnbscan.com', 4663:'https://robinhoodchain.blockscout.com' };

    // Opaque badge backgrounds, so a hovered row cannot lower the text's contrast (each is at least 4.5:1).
    const SEV = {
      CRITICAL: { bg:'var(--block)', text:'var(--on-accent)', border:'1px solid var(--block)' },
      HIGH:     { bg:'var(--ground-alt)', text:'var(--block-text)', border:'2px solid var(--block-edge)' },
      MEDIUM:   { bg:'var(--ground-alt)', text:'var(--secondary)', border:'1px solid var(--edge)' },
      LOW:      { bg:'var(--ground-alt)', text:'var(--safe-text)', border:'1px solid var(--safe)' },
      UNKNOWN:  { bg:'var(--unknown)', text:'var(--on-unknown)', border:'1px dashed var(--on-unknown)' },
    };

    // A chart with nothing in it has no peak, so naming an hour or a chain would state a
    // reading that does not exist. Used by both charts' accessible names.
    function peakPhrase(data, where) {
      const max = data.length ? Math.max(...data.map(point => point.count)) : 0;
      if (!max) return 'no detections recorded';
      return `peak ${max} ${where(data.find(point => point.count === max))}`;
    }

    // ─── Utilities ────────────────────────────────────────────────────────────
    function timeAgo(ts) {
      if (!ts) return '—';
      const d = Date.now() / 1000 - ts;
      if (d < 60)    return `${Math.floor(d)}s ago`;
      if (d < 3600)  return `${Math.floor(d/60)}m ago`;
      if (d < 86400) return `${Math.floor(d/3600)}h ago`;
      return `${Math.floor(d/86400)}d ago`;
    }

    function short(addr) {
      if (!addr) return '—';
      return addr.slice(0,6) + '…' + addr.slice(-4);
    }

    // A contract detection is its contract. A mempool alert is its attacker: the sandwich's front-runner
    // or the approval's spender. Its target_token is the token the victim buys or approves, so a sell-side
    // sandwich's is the quote asset (WBNB, WETH, USDT), not the threat.
    function threatAddress(t) {
      if (t.address) return { addr: t.address, role: null };
      if (t.attacker_addr) return { addr: t.attacker_addr, role: 'Attacker' };
      return { addr: t.target_token || '', role: null };
    }

    function bucketByHour(threats, hrs = 24) {
      const now = Date.now() / 1000;
      const buckets = Array(hrs).fill(0);
      threats.forEach(t => {
        const age = Math.floor((now - (t.detected_at || t.created_at || 0)) / 3600);
        if (age >= 0 && age < hrs) buckets[hrs - 1 - age]++;
      });
      return buckets.map((count, i) => {
        const d = new Date(Date.now() - (hrs - 1 - i) * 3600000);
        return { hour: String(d.getHours()).padStart(2,'0') + ':00', count };
      });
    }

    function chainDist(threats) {
      const counts = {};
      threats.forEach(t => {
        const id = t.chain_id || 'unknown';
        const name = CHAIN_NAMES[id] || (id === 'unknown' ? 'Unknown' : `Chain ${id}`);
        if (!counts[id]) counts[id] = { name, count:0, color:CHAIN_COLORS[id] || 'secondary' };
        counts[id].count++;
      });
      return Object.values(counts).sort((a,b) => b.count - a.count);
    }

    function Loading() {
      return <div className="text-sm text-secondary">Loading</div>;
    }

    function Toast({ msg, type = 'success', onDone }) {
      useEffect(() => { const t = setTimeout(onDone, 2200); return () => clearTimeout(t); }, []);
      const isErr = type === 'error';
      return ReactDOM.createPortal(
        <div role="status" className="toast-anim fixed bottom-6 right-6 z-50 flex items-center gap-2 px-4 py-3 rounded-lg"
             style={{ background:'var(--ground-alt)', border:'1px solid var(--edge)', color:'var(--ink)', fontSize:13 }}>
          {isErr
            ? <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
              </svg>
            : <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24" aria-hidden="true">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
          }
          <span className="font-medium">{msg}</span>
        </div>,
        document.body,
      );
    }

    // ─── Flag Modal ───────────────────────────────────────────────────────────
    function FlagModal({ threat, onClose, onResult }) {
      const [reason,  setReason]  = useState('');
      const [sending, setSending] = useState(false);
      // Why the last report was not sent. It shows in the dialog: a toast would sit under the backdrop.
      const [failure, setFailure] = useState(null);
      const dialog = useRef(null);
      useEffect(() => { setReason(''); setFailure(null); }, [threat]);
      // The open dialog makes the page behind it inert, takes focus, keeps Tab inside it, closes on
      // Escape and returns focus to the control that opened it.
      useEffect(() => {
        if (!threat) return;
        const opener = document.activeElement;
        const page = document.getElementById('root');
        page.inert = true;
        dialog.current.querySelector('textarea').focus();
        function onKey(e) {
          if (e.key === 'Escape') {
            e.preventDefault();
            onClose();
          } else if (e.key === 'Tab') {
            e.preventDefault();
            const items = [...dialog.current.querySelectorAll('button:not([disabled]), textarea')];
            const index = items.indexOf(document.activeElement);
            const next = e.shiftKey ? (index <= 0 ? items.length : index) - 1 : (index + 1) % items.length;
            items[next].focus();
          }
        }
        document.addEventListener('keydown', onKey);
        return () => {
          document.removeEventListener('keydown', onKey);
          // Before the focus call: an element inside an inert page cannot take focus.
          page.inert = false;
          opener.focus();
        };
      }, [threat]);
      if (!threat) return null;
      const { addr, role } = threatAddress(threat);
      const type = (threat.type || threat.alert_type || 'unknown').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
      const canSend = Boolean(addr && threat.chain_id) && !sending;

      async function submit() {
        setSending(true);
        setFailure(null);
        try {
          const r = await fetch(`${API}/api/report`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              address: addr, chainId: threat.chain_id,
              report_type: 'false_positive', reason: reason.trim() || null,
            }),
          });
          if (r.ok) { onResult('Report sent. Thank you.', 'success'); onClose(); }
          else if (r.status === 429) setFailure('Too many reports. Try again in a minute.');
          else setFailure(`Report not sent (HTTP ${r.status}).`);
        } catch (e) {
          setFailure('Report not sent: network error.');
        } finally {
          setSending(false);
        }
      }
      // Render on the body so the backdrop and dialog cover the full dashboard.
      return ReactDOM.createPortal(
        <div className="fixed inset-0 z-50 flex items-center justify-center"
             style={{ background:'color-mix(in srgb, var(--shadow) 72%, transparent)' }}
             onClick={onClose}>
          <div ref={dialog} role="dialog" aria-modal="true" aria-labelledby="flag-title"
               className="bg-ground-alt border border-hairline rounded-lg p-6 w-full max-w-md mx-4 fade-up"
               style={{ border:'1px solid var(--hairline)' }}
               onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-5">
              <h2 id="flag-title" className="font-semibold text-base" style={{ color:'var(--ink)' }}>Flag False Positive</h2>
              <button onClick={onClose} aria-label="Close"
                      className="w-11 h-11 md:w-8 md:h-8 flex items-center justify-center rounded-lg transition-colors hover:bg-ground"
                      style={{ color:'var(--secondary)', fontSize:18, lineHeight:1 }}>✕</button>
            </div>

            <div className="space-y-2 mb-4">
              <div className="rounded-lg p-3" style={{ background:'var(--ground)' }}>
                <div className="text-xs mb-1" style={{ color:'var(--secondary)' }}>Threat Type</div>
                <div className="text-sm font-medium" style={{ color:'var(--ink)' }}>{type}</div>
              </div>
              <div className="rounded-lg p-3" style={{ background:'var(--ground)' }}>
                <div className="text-xs mb-1" style={{ color:'var(--secondary)' }}>{role ? `${role} Address` : 'Address'}</div>
                 <div className="text-xs font-mono break-all" style={{ color:'var(--ink)', fontFamily:'IBM Plex Mono,monospace' }}>
                  {addr || '—'}
                </div>
              </div>
            </div>

            <textarea className="w-full rounded-lg p-3 text-sm resize-none"
                      style={{ background:'var(--ground)', border:'1px solid var(--edge)', color:'var(--ink)',
                               height:80, fontFamily:'inherit' }}
                      maxLength={1000} value={reason} onChange={e => setReason(e.target.value)}
                      aria-label="Why is this a false positive?" placeholder="Why is this a false positive?" />

             {failure && <div role="alert" className="text-sm mt-3" style={{ color:'var(--secondary)' }}>{failure}</div>}

            <div className="flex gap-2 mt-4">
              <button onClick={onClose} className="flex-1 py-2.5 min-h-[44px] md:min-h-0 rounded-lg text-sm font-medium transition-colors"
                      style={{ background:'var(--ground-alt)', color:'var(--ink)', border:'1px solid var(--edge)' }}>Cancel</button>
              <button onClick={submit} disabled={!canSend} className="flex-1 py-2.5 min-h-[44px] md:min-h-0 rounded-lg text-sm font-medium transition-colors"
                      style={{ background:'var(--accent-fill)', color:'var(--on-accent)', opacity: canSend ? 1 : 0.5 }}>
                {sending ? 'Sending…' : 'Submit Report'}
              </button>
            </div>
          </div>
        </div>,
        document.body,
      );
    }

    // ─── Error Banner ──────────────────────────────────────────────────────────
    function ErrorBanner({ msg, onRetry }) {
      return (
        <div className="flex items-center justify-between px-4 py-3 rounded-lg mb-3 text-sm"
             style={{ background:'var(--ground-alt)', border:'1px solid var(--edge)', color:'var(--ink)' }}>
          <span className="flex items-center gap-2">
            <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" aria-hidden="true">
              <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
            </svg>
            {msg}
          </span>
          <button onClick={onRetry} className="ml-4 px-3 py-1 min-h-[44px] md:min-h-0 rounded-lg text-xs font-semibold transition-colors"
                  style={{ background:'var(--ground)', color:'var(--ink)', border:'1px solid var(--edge)' }}>Retry</button>
        </div>
      );
    }

    // ─── Threat Row ────────────────────────────────────────────────────────────
    function ThreatRow({ t, onCopy, onFlag }) {
      const [hov, setHov] = useState(false);
      const rawSev  = (t.risk_level || t.severity || 'UNKNOWN').toUpperCase();
      const sev     = SEV[rawSev] ? rawSev : 'UNKNOWN';
      const sc      = SEV[sev];
      const type    = (t.type || t.alert_type || 'unknown').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
      const { addr, role } = threatAddress(t);
      const chain   = CHAIN_NAMES[t.chain_id] || (t.chain_id ? `Chain ${t.chain_id}` : 'Unknown');
      const exp     = EXPLORERS[t.chain_id] || '';
      const ts      = t.detected_at || t.created_at || 0;
      const note    = (Array.isArray(t.flags) ? t.flags : []).slice(0,2).join(', ') || t.description || '';

      return (
        <div className="rounded-lg p-4 transition-all duration-150"
             style={{
               background: hov ? 'var(--panel)' : 'var(--ground-alt)',
               border: `1px solid ${hov ? 'var(--secondary)' : 'var(--hairline)'}`,
                            }}
             onMouseEnter={() => setHov(true)}
             onMouseLeave={() => setHov(false)}>
          <div className="flex flex-wrap md:flex-nowrap items-start gap-3">

            {/* Severity badge */}
            <span className="shrink-0 text-xs font-bold px-2 py-1 rounded-md uppercase tracking-wide text-center"
                  style={{ background:sc.bg, color:sc.text, border:sc.border, minWidth:64 }}>
              {sev}
            </span>

            {/* Content */}
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="font-semibold text-sm" style={{ color:'var(--ink)' }}>{type}</span>
                <span className="text-xs px-2 py-0.5 rounded-full font-medium"
                      style={{ background:'var(--ground)', color:'var(--secondary)' }}>{chain}</span>
              </div>
              {note && <div className="text-xs mt-0.5 [overflow-wrap:anywhere]" style={{ color:'var(--secondary)' }}>{note}</div>}
              <div className="text-xs mt-0.5 font-mono" style={{ color:'var(--ink)', fontFamily:'IBM Plex Mono,monospace' }}>
                {role && <span style={{ color:'var(--secondary)' }}>{role} </span>}{addr ? short(addr) : '—'}
              </div>
              {role && t.target_token && (
                <div className="text-xs mt-0.5 font-mono" style={{ color:'var(--secondary)', fontFamily:'IBM Plex Mono,monospace' }}>
                  Target token {short(t.target_token)}
                </div>
              )}
            </div>

            {/* Time */}
            <div className="text-xs shrink-0" style={{ color:'var(--secondary)' }}>{timeAgo(ts)}</div>

            {/* Quick actions */}
            <div className="flex items-center justify-end gap-1 shrink-0 w-full md:w-auto">

              {exp && addr && (
                <a href={`${exp}/address/${addr}`} target="_blank" rel="noopener noreferrer"
                   title="Investigate on Explorer" aria-label={`Investigate ${short(addr)} on the explorer`}
                   className="w-11 h-11 md:w-8 md:h-8 flex items-center justify-center rounded-lg transition-colors"
                   style={{ background:'var(--ground-alt)', color:'var(--secondary)' }}
                   onClick={e => e.stopPropagation()}>
                  <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                  </svg>
                </a>
              )}

              {addr && (
                <button title="Copy Address" aria-label={`Copy ${short(addr)} to the clipboard`}
                        className="w-11 h-11 md:w-8 md:h-8 flex items-center justify-center rounded-lg transition-colors"
                        style={{ background:'var(--ground-alt)', color:'var(--secondary)' }}
                        onClick={() => onCopy(addr)}>
                  <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="9" y="9" width="13" height="13" rx="2"/>
                    <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
                  </svg>
                </button>
              )}

              <button title="Flag False Positive" aria-label={`Flag ${addr ? short(addr) : type} as a false positive`}
                      className="w-11 h-11 md:w-8 md:h-8 flex items-center justify-center rounded-lg transition-colors"
                       style={{ background:'var(--ground-alt)', color:'var(--secondary)' }}
                      onClick={() => onFlag(t)}>
                <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
                  <line x1="4" y1="22" x2="4" y2="15"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ─── Threat Log Table ─────────────────────────────────────────────────────
    const CHAIN_FILTERS = [
      { label:'All Chains', val:'' },
      { label:'ETH',        val:'1' },
      { label:'BNB',        val:'56' },
      { label:'Base',       val:'8453' },
      { label:'Arbitrum',   val:'42161' },
      { label:'Polygon',    val:'137' },
      { label:'Optimism',   val:'10' },
      { label:'opBNB',      val:'204' },
      { label:'Robinhood',  val:'4663' },
    ];

    function threatKey(t) {
      return [t.type, t.chain_id, threatAddress(t).addr, t.victim_tx || t.attacker_tx || '',
              t.detected_at || t.created_at || ''].join(':');
    }

    // The feed lists the contract scores the firewalls write, and launch scans never write them, so the
    // Robinhood Chain rows are in the launches panel: the link goes there. Null launches are unavailable,
    // not none, so only a loaded list is counted.
    function RobinhoodFeedNote({ launches }) {
      return (
        <div className="text-center py-16 text-sm" style={{ color:'var(--secondary)' }}>
          <div>No extension or agent firewall detections on Robinhood Chain in the current window.</div>
          <a href="#robinhood-chain" className="inline-flex items-center mt-3 min-h-[44px] md:min-h-0 font-semibold"
             style={{ color:'var(--accent)' }}>
            {launches && launches.length
              ? `See the ${launches.length} blocked ${launches.length === 1 ? 'launch' : 'launches'} in the Robinhood Chain panel ↑`
              : 'Open the Robinhood Chain launches panel ↑'}
          </a>
        </div>
      );
    }

    function ThreatLogTable({ threats, launches, loading, error, mempoolUnavailable, onRetry, chain, onChain }) {
      const [toast, setToast] = useState(null);
      const [flag,  setFlag]  = useState(null);

      const filtered = chain ? threats.filter(t => String(t.chain_id) === chain) : threats;

      function handleCopy(addr) {
        navigator.clipboard.writeText(addr)
          .then(() => setToast({ msg:'Address copied to clipboard', type:'success' }))
          .catch(() => setToast({ msg:'Failed to copy — try manually', type:'error' }));
      }

      return (
        <div>
          {/* Chain filter pills */}
          <div role="group" aria-label="Filter by chain" className="flex gap-2 flex-wrap mb-4">
            {CHAIN_FILTERS.map(f => {
              const active = chain === f.val;
              return (
                <button key={f.val} onClick={() => onChain(f.val)} aria-pressed={active}
                        className="px-3 py-1.5 min-h-[44px] md:min-h-0 rounded-lg text-xs font-medium transition-all duration-150"
                        style={{
                           background: active ? 'var(--accent-tint)' : 'var(--ground-alt)',
                           border: `1px solid ${active ? 'var(--accent)' : 'var(--edge)'}`,
                           color: active ? 'var(--ink)' : 'var(--secondary)',
                        }}>
                  {f.label}
                </button>
              );
            })}
            <span className="self-center text-xs" style={{ color:'var(--secondary)' }}>
              {loading ? 'Loading…' : `${filtered.length} ${filtered.length === 1 ? 'threat' : 'threats'}`}
            </span>
          </div>

          {error && <ErrorBanner msg={error} onRetry={onRetry} />}

          {mempoolUnavailable && (
            <div className="px-4 py-3 rounded-lg mb-3 text-sm"
                 style={{ background:'var(--ground-alt)', border:'1px solid var(--hairline)', color:'var(--secondary)' }}>
              Mempool alerts unavailable: {mempoolUnavailable}
            </div>
          )}

          <div tabIndex={0} aria-label="Threat feed" className="flex flex-col gap-2 max-h-none md:max-h-[520px]" style={{ overflowY:'auto', paddingRight:2 }}>
            {loading
              ? <Loading />
              : filtered.length === 0
                ? !error && chain === String(LAUNCH_CHAIN)
                  ? <RobinhoodFeedNote launches={launches} />
                  : <div className="text-center py-16 text-sm" style={{ color:'var(--secondary)' }}>
                      {error
                        ? 'Threat data unavailable — check the error above.'
                        : mempoolUnavailable
                          ? chain
                            ? 'No contract detections on this chain in the current window.'
                            : 'No contract detections in the current window.'
                          : chain
                            ? 'No threats on this chain in the current window.'
                            : 'No threats detected. Monitoring active.'
                      }
                    </div>
                : filtered.map(t => (
                    <ThreatRow key={threatKey(t)} t={t} onCopy={handleCopy} onFlag={setFlag} />
                  ))
            }
          </div>

          {toast && <Toast msg={toast.msg} type={toast.type} onDone={() => setToast(null)} />}
          <FlagModal threat={flag} onClose={() => setFlag(null)}
                     onResult={(msg, type) => setToast({ msg, type })} />
        </div>
      );
    }

    // ─── Campaigns Grid ────────────────────────────────────────────────────────
    function CampaignsGrid({ campaigns, loading }) {
      if (loading) return <Loading />;

      if (campaigns === null) {
        return <div className="text-center py-8 text-sm" style={{ color:'var(--secondary)' }}>Campaign data unavailable.</div>;
      }

      if (!campaigns.length) {
        return <div className="text-center py-8 text-sm" style={{ color:'var(--secondary)' }}>No campaigns detected.</div>;
      }

      return (
        <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">
          {campaigns.map((c, i) => {
            const rp  = c.risk_profile;
            const scored = rp && Object.keys(rp).length > 0;
            const hi  = scored ? (rp.HIGH || 0) + (rp.CRITICAL || 0) : null;
            const tot = c.contract_count || 1;
            const pct = scored ? Math.min(100, (hi / tot) * 100) : 0;
            const bar = !scored ? 'var(--secondary)' : pct > 50 ? 'var(--block-text)' : pct > 20 ? 'var(--secondary)' : 'var(--safe-text)';
            const barText = !scored ? 'var(--secondary)' : pct > 50 ? 'var(--block-text)' : pct > 20 ? 'var(--secondary)' : 'var(--safe-text)';
            return (
              <div key={i} className="rounded-lg p-4 fade-up"
                   style={{ background:'var(--ground-alt)', border:'1px solid var(--hairline)' }}>
                <div className="text-sm font-medium font-mono break-all"
                     style={{ color:'var(--ink)', fontFamily:'IBM Plex Mono,monospace' }}>
                  {(c.deployer || '').slice(0,10)}…{(c.deployer || '').slice(-6)}
                </div>
                <div className="text-xs mt-2" style={{ color:'var(--secondary)' }}>
                  {c.contract_count} contracts · {c.chain_count} chain(s)
                  {c.funder ? ` · Funder: ${c.funder.slice(0,8)}…` : ''}
                </div>
                <div className="mt-3 rounded-full overflow-hidden" style={{ height:5, background:'var(--hairline)' }}>
                  <div className="h-full rounded-full transition-all duration-700"
                       style={{ width:`${pct}%`, background:bar }} />
                </div>
                <div className="text-xs mt-2" style={{ color:'var(--secondary)' }}>
                  {scored
                    ? <><span style={{ color:barText }}>{hi} HIGH/CRIT</span> / {tot} total</>
                    : <span style={{ color:barText }}>Contracts not scored yet</span>}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    // ─── Threat Velocity Chart ────────────────────────────────────────────────
    function ThreatVelocityChart({ data, loading, unavailable, capped, colors, asOf }) {
      if (loading) {
        return (
          <div className="bg-ground-alt border border-hairline rounded-lg p-5">
            <h3 className="text-[15px] font-semibold mb-4" style={{ color:'var(--ink)' }}>Threat Velocity</h3>
            <div className="flex items-center justify-center text-sm" style={{ height:190, color:'var(--secondary)' }}>Loading</div>
          </div>
        );
      }
      const short = capped.filter(c => c.since === null || c.since > Date.now() / 1000 - 86400);
      const shortNames = short.map(c => c.name).join(' and ');
      if (unavailable || short.length) {
        return (
          <div className="bg-ground-alt border border-hairline rounded-lg p-5">
            <h3 className="text-[15px] font-semibold mb-4" style={{ color:'var(--ink)' }}>Threat Velocity</h3>
            <div className="flex items-center justify-center text-sm text-center px-4" style={{ height:190, color:'var(--secondary)' }}>
              {unavailable
                ? 'Threat feed unavailable.'
                : short.some(c => c.since === null)
                  ? 'Hidden: some of the newest ' + FEED_LIMIT + ' ' + shortNames + ' carry no time, so how far back they '
                    + 'reach is unknown and an hourly count for the last 24 h could show missing hours as zero.'
                  : 'Hidden: the newest ' + FEED_LIMIT + ' ' + shortNames + ' reach back only to '
                    + new Date(Math.max(...short.map(c => c.since)) * 1000).toLocaleString() + ', '
                    + 'so an hourly count for the last 24 h would show the earlier hours as zero.'}
            </div>
          </div>
        );
      }
      return (
        <div className="bg-ground-alt border border-hairline rounded-lg p-5">
          <div className="flex items-start justify-between mb-4">
            <div>
              <h3 className="text-[15px] font-semibold" style={{ color:'var(--ink)' }}>Threat Velocity</h3>
              <div className="text-xs mt-0.5" style={{ color:'var(--secondary)' }}>
                Detections per hour · last 24 h · as of {asOf ? timeAgo(asOf / 1000) : '—'}
              </div>
            </div>
            <span className="text-xs px-2.5 py-1 rounded-full font-medium"
                  style={{ background:'var(--ground)', color:'var(--secondary)' }}>Hourly</span>
          </div>
          <ResponsiveContainer width="100%" height={190}>
            <AreaChart data={data} margin={{ top:4, right:4, left:-20, bottom:0 }} accessibilityLayer
                       aria-label={'Detections per hour, last 24 hours, ' + peakPhrase(data, point => 'at ' + point.hour)}>
              <CartesianGrid strokeDasharray="3 3" stroke={colors.hairlineStrong} vertical={false} />
              <XAxis dataKey="hour" tick={{ fill:colors.secondary, fontSize:10 }}
                     tickLine={false} axisLine={false} interval={5} />
              <YAxis tick={{ fill:colors.secondary, fontSize:10 }} tickLine={false} axisLine={false} allowDecimals={false} />
              <Tooltip contentStyle={{ background:colors.groundAlt, border:'1px solid ' + colors.hairline,
                                       borderRadius:8, color:colors.ink, fontSize:12 }}
                       cursor={{ stroke:colors.hairline, strokeWidth:1 }} />
              <Area type="monotone" dataKey="count" name="Threats"
                    stroke={colors.secondary} strokeWidth={2} fill={colors.secondary} fillOpacity={0.12} dot={false}
                    isAnimationActive={false} />
            </AreaChart>
          </ResponsiveContainer>
        </div>
      );
    }

    // ─── Chain Distribution Chart ─────────────────────────────────────────────

    function ChainDistributionChart({ data, loading, unavailable, capped, colors, asOf }) {
      const haslive = data.length > 0;
      const cappedNote = capped.length
        ? ' · ' + capped.map(c => c.name).join(' and ') + ' capped at the newest ' + FEED_LIMIT
        : '';
      return (
        <div className="bg-ground-alt border border-hairline rounded-lg p-5">
          <div className="flex items-start justify-between mb-4">
            <div>
              <h3 className="text-[15px] font-semibold" style={{ color:'var(--ink)' }}>Chain Distribution</h3>
              <div className="text-xs mt-0.5" style={{ color:'var(--secondary)' }}>
                Newest {FEED_LIMIT} per source in the loaded feed · as of {asOf ? timeAgo(asOf / 1000) : '—'}{cappedNote}
              </div>
            </div>
            {haslive
              ? capped.length
                ? <span className="text-xs px-2.5 py-1 rounded-full font-medium"
                        style={{ background:'var(--ground)', color:'var(--secondary)' }}>Capped</span>
                : <span className="text-xs px-2.5 py-1 rounded-full font-medium"
                        style={{ background:'var(--ground)', color:'var(--secondary)' }}>Live</span>
              : !loading && <span className="text-xs px-2.5 py-1 rounded-full font-medium"
                      style={{ background:'var(--ground)', color:'var(--secondary)' }}>No data</span>
            }
          </div>
          {haslive
            ? <ResponsiveContainer width="100%" height={190}>
                <BarChart data={data} margin={{ top:4, right:4, left:-20, bottom:0 }} accessibilityLayer
                          aria-label={'Threat detections by chain, ' + peakPhrase(data, point => 'on ' + point.name)}>
                  <CartesianGrid strokeDasharray="3 3" stroke={colors.hairlineStrong} vertical={false} />
                  <XAxis dataKey="name" tick={{ fill:colors.secondary, fontSize:10 }} tickLine={false}
                            axisLine={false}
                            interval={data.length > 4 ? 0 : 'preserveEnd'}
                            angle={data.length > 4 ? -30 : 0}
                            textAnchor={data.length > 4 ? 'end' : 'middle'}
                            height={data.length > 4 ? 48 : 30} />
                  <YAxis tick={{ fill:colors.secondary, fontSize:10 }} tickLine={false} axisLine={false} allowDecimals={false} />
                  <Tooltip contentStyle={{ background:colors.groundAlt, border:'1px solid ' + colors.hairline,
                                           borderRadius:8, color:colors.ink, fontSize:12 }}
                           cursor={{ fill:colors.hairline }} />
                  <Bar dataKey="count" name="Threats" radius={[4,4,0,0]} isAnimationActive={false}>
                    {data.map(d => <Cell key={d.name} fill={colors[d.color]} />)}
                  </Bar>
                </BarChart>
              </ResponsiveContainer>
            : <div className="flex items-center justify-center text-sm" style={{ height:190, color:'var(--secondary)' }}>
                {loading ? 'Loading' : unavailable ? 'Threat feed unavailable.' : 'No threats in the current feed.'}
              </div>
          }
        </div>
      );
    }

    // ─── Robinhood Chain Panel ────────────────────────────────────────────────
    // The hunter's launch scans are recorded on discovered_launches, never on the contract scores the
    // feed and the contract counts read, so this panel reads /api/launches and the launch fields of
    // /api/stats instead.
    // Mirrors core/telegram_formatter.py describe_impostor_check, without the per-token detail.
    const IMPOSTOR = {
      impostor:  { label:'Impersonates an official Robinhood Chain token' },
      collision: { label:'Shares a ticker or name with an official Robinhood Chain token' },
      official:  { label:'An official Robinhood Chain token' },
      none:      { label:'No match among official Robinhood Chain tokens' },
      unknown:   { label:'Check against official tokens unknown' },
    };
    const NOT_CHECKED = { label:'Not checked against official tokens' };
    const LAUNCH_FLAGS = 6;

    function LaunchRow({ launch }) {
      const scan    = launch.scan || {};
      const flags   = Array.isArray(scan.flags) ? scan.flags : [];
      const check   = IMPOSTOR[(launch.impostor_check || {}).status] || NOT_CHECKED;
      const exp     = EXPLORERS[LAUNCH_CHAIN];
      const outcome = String(scan.outcome || 'unknown').replace(/_/g, ' ');
      return (
        <div className="rounded-lg p-4" style={{ background:'var(--ground-alt)', border:'1px solid var(--hairline)' }}>
          <div className="flex flex-wrap md:flex-nowrap items-start gap-3">
            <span className="shrink-0 text-xs font-bold px-2 py-1 rounded-md uppercase tracking-wide text-center"
                  style={{ background:SEV.CRITICAL.bg, color:SEV.CRITICAL.text, border:SEV.CRITICAL.border, minWidth:64 }}>
              {outcome}
            </span>
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="font-semibold text-sm" style={{ color:'var(--ink)' }}>
                  {scan.risk_score == null ? 'Risk score not recorded' : `Risk ${scan.risk_score}`}
                  {scan.risk_level ? ` · ${scan.risk_level}` : ''}
                </span>
                <span className="text-xs px-2 py-0.5 rounded-full font-medium"
                      style={{ background:'var(--ground)', color:'var(--secondary)' }}>
                  {launch.launchpad || 'Launchpad unknown'}
                </span>
                <span className="text-xs" style={{ color:'var(--secondary)' }}>
                  {scan.status === 'ok' ? 'complete scan' : 'partial scan'}
                </span>
              </div>
              {flags.length > 0 && (
                <div className="text-xs mt-0.5 [overflow-wrap:anywhere]" style={{ color:'var(--secondary)' }}>
                  {flags.slice(0, LAUNCH_FLAGS).join(', ')}
                  {flags.length > LAUNCH_FLAGS ? ` and ${flags.length - LAUNCH_FLAGS} more` : ''}
                </div>
              )}
              <div className="text-xs mt-0.5" style={{ color:'var(--secondary)' }}>{check.label}</div>
              <div className="text-xs mt-0.5 font-mono" style={{ color:'var(--ink)', fontFamily:'IBM Plex Mono,monospace' }}>
                {short(launch.token_address)}
              </div>
            </div>
            <div className="text-xs shrink-0" style={{ color:'var(--secondary)' }}>{timeAgo(scan.scanned_at)}</div>
            <div className="flex items-center justify-end gap-1 shrink-0 w-full md:w-auto">
              {launch.token_address && (
                <a href={`${exp}/address/${launch.token_address}`} target="_blank" rel="noopener noreferrer"
                   title="Investigate on Explorer" aria-label={`Investigate ${short(launch.token_address)} on the explorer`}
                   className="w-11 h-11 md:w-8 md:h-8 flex items-center justify-center rounded-lg transition-colors"
                   style={{ background:'var(--ground-alt)', color:'var(--accent)' }}>
                  <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                  </svg>
                </a>
              )}
              {launch.verdict_url && (
                <a href={`${API}${launch.verdict_url}`} target="_blank" rel="noopener noreferrer"
                   aria-label={`Open the verdict for ${short(launch.token_address)}`}
                   className="px-3 min-h-[44px] md:min-h-0 md:h-8 flex items-center rounded-lg text-xs font-semibold transition-colors"
                   style={{ background:'var(--ground-alt)', color:'var(--accent)' }}>
                  Verdict ↗
                </a>
              )}
            </div>
          </div>
        </div>
      );
    }

    function RobinhoodPanel({ launches, launchesLoading, cursor, onLoadOlder, loadingOlder, olderError }) {
      const [expanded, setExpanded] = useState(false);
      const registry  = (
        <a href={`${EXPLORERS[LAUNCH_CHAIN]}/address/${REGISTRY_ADDRESS}`} target="_blank" rel="noopener noreferrer"
           className="inline-flex items-center min-h-[44px] md:min-h-0" style={{ color:'var(--accent)' }}>
          Registry contract ↗
        </a>
      );
      const shown = launches && !expanded ? launches.slice(0, LAUNCH_VISIBLE) : launches;
      const allShown = Boolean(launches) && shown.length === launches.length;
      return (
        <div className="bg-ground-alt border border-hairline rounded-lg p-4 md:p-5" style={{ border:'1px solid var(--hairline)' }}>

          <div className="text-xs mb-3 max-w-[72ch]" style={{ color:'var(--secondary)' }}>
            Blocked token launches on Robinhood Chain, newest first. Each row links to its published verdict when one is recorded.
            This list refreshes every {SLOW_REFRESH_MS / 60000} minutes. {registry}
          </div>
          <div className="flex flex-col gap-2">
            {launchesLoading
              ? <Loading />
              : launches === null
                ? <div className="text-center py-8 text-sm" style={{ color:'var(--secondary)' }}>Robinhood Chain launches unavailable.</div>
                : launches.length === 0
                  ? <div className="text-center py-8 text-sm" style={{ color:'var(--secondary)' }}>No blocked launches on record.</div>
                  : shown.map(l => <LaunchRow key={l.token_address} launch={l} />)
            }
          </div>
          {launches && launches.length > 0 && (
            <div className="flex flex-wrap items-center justify-between gap-3 mt-3 text-xs" style={{ color:'var(--secondary)' }}>
              <span>
                {cursor
                  ? `Showing ${shown.length} of the ${launches.length} loaded; more blocked launches are on record.`
                  : launches.length === 1
                    ? 'The only blocked launch on record.'
                    : `Showing ${shown.length} of all ${launches.length} blocked launches on record.`}
              </span>
              <span className="flex flex-wrap items-center gap-2">
                {launches.length > LAUNCH_VISIBLE && (
                  <button onClick={() => setExpanded(v => !v)} aria-expanded={expanded}
                          className="px-3 py-1.5 min-h-[44px] md:min-h-0 rounded-lg text-xs font-semibold transition-colors"
                          style={{ background:'var(--ground-alt)', color:'var(--ink)' }}>
                    {expanded ? `Show the newest ${LAUNCH_VISIBLE} only` : `Show ${launches.length - LAUNCH_VISIBLE} more`}
                  </button>
                )}
                {allShown && cursor && (
                  <button onClick={onLoadOlder} disabled={loadingOlder}
                          className="px-3 py-1.5 min-h-[44px] md:min-h-0 rounded-lg text-xs font-semibold transition-colors"
                          style={{ background:'var(--ground-alt)', color:'var(--ink)', opacity: loadingOlder ? 0.5 : 1 }}>
                    {loadingOlder ? 'Loading…' : 'Load older blocked launches'}
                  </button>
                )}
              </span>
            </div>
          )}
          {olderError && <div role="alert" className="text-xs mt-2" style={{ color:'var(--secondary)' }}>{olderError}</div>}
        </div>
      );
    }

    // ─── Provider Answers ────────────────────────────────────────────────────
    // The Unknown ledger (core/unknown_ledger.py) as /api/stats carries it: one count per lookup sent
    // to a data provider. The rows come with the stats reply, so this panel sends no request of its own.
    const LEDGER_OUTCOMES = [
      { key:'answered', label:'Answered', color:'var(--secondary)' },
      { key:'unknown',  label:'Unknown',  color:'var(--secondary)' },
      { key:'failed',   label:'Failed',   color:'var(--secondary)' },
    ];

    function ledgerRows(table, name) {
      return Object.entries(table || {})
        .map(([key, counts]) => ({ name: name(key), ...counts, total: counts.answered + counts.unknown + counts.failed }))
        .sort((a, b) => b.total - a.total);
    }

    function ProviderAnswersPanel({ stats, loading, asOf }) {
      const ledger = stats ? stats.unknown_ledger : null;
      if (loading) {
        return (
          <div className="bg-ground-alt border border-hairline rounded-lg p-4 md:p-5">
            <Loading />
          </div>
        );
      }
      if (!ledger) {
        return (
          <div className="bg-ground-alt border border-hairline rounded-lg p-4 md:p-5 text-center py-8 text-sm" style={{ border:'1px solid var(--hairline)', color:'var(--secondary)' }}>
            Provider answers unavailable.
          </div>
        );
      }
      const since     = new Date(ledger.counting_since * 1000).toLocaleString();
      const providers = ledgerRows(ledger.by_provider, key => key);
      const chains    = ledgerRows(ledger.by_chain, key => CHAIN_NAMES[key] || `Chain ${key}`);
      return (
        <div className="bg-ground-alt border border-hairline rounded-lg p-4 md:p-5" style={{ border:'1px solid var(--hairline)' }}>
          <div className="text-xs mb-3 max-w-[72ch]" style={{ color:'var(--secondary)' }}>
            Every lookup ShieldBot sent a data provider since {since}, as of {asOf ? timeAgo(asOf / 1000) : '—'}. Answered is the data
            asked for; unknown is the provider saying it has none for that subject; failed is no usable reply. A
            scan missing an answer reports what it could not check as unknown, never as safe.
            {stats.background_workers_note
              && ' This API process counts its own lookups only; the hunter and the launch watch count in the workers process.'}
          </div>
          {providers.length === 0
            ? <div className="text-center py-8 text-sm" style={{ color:'var(--secondary)' }}>No provider lookups since {since}.</div>
            : <div style={{ overflowX:'auto' }}>
                <table className="w-full text-xs" style={{ borderCollapse:'collapse' }}>
                  <thead>
                    <tr style={{ color:'var(--secondary)' }}>
                      <th scope="col" className="text-left font-medium py-2 pr-3">Provider</th>
                      {LEDGER_OUTCOMES.map(o => (
                        <th key={o.key} scope="col" className="text-right font-medium py-2 pl-3">{o.label}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {providers.map(row => (
                      <tr key={row.name} style={{ borderTop:'1px solid var(--hairline)' }}>
                        <th scope="row" className="text-left font-mono font-medium py-2 pr-3"
                            style={{ color:'var(--ink)', fontFamily:'IBM Plex Mono,monospace' }}>{row.name}</th>
                        {LEDGER_OUTCOMES.map(o => (
                          <td key={o.key} className="text-right tabular-nums py-2 pl-3"
                              style={{ color:'var(--secondary)' }}>{row[o.key].toLocaleString()}</td>
                        ))}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
          }
          {chains.length > 0 && (
            <div className="text-xs mt-3" style={{ color:'var(--secondary)' }}>
              By chain: {chains.map(row =>
                `${row.name} ${row.answered.toLocaleString()} answered · ${row.unknown.toLocaleString()} unknown · ${row.failed.toLocaleString()} failed`
              ).join('; ')}.
            </div>
          )}
        </div>
      );
    }

    // ─── Section Label ────────────────────────────────────────────────────────
    function BaseAttestationsPanel({ data }) {
      const riskColor = (label) => {
        if (label === 'DANGER' || label === 'HIGH') return 'var(--block-text)';
        if (label === 'WARNING' || label === 'MEDIUM') return 'var(--secondary)';
        if (label === 'SAFE' || label === 'LOW') return 'var(--safe-text)';
        return 'var(--ink)';
      };
      const chainName = (id) => CHAIN_NAMES[id] || `chain ${id}`;
      const list = data.attestations || [];
      const summary = data.summary || {};
      // A retired attestor writes nothing new, so the panel is a record. A date-only ISO string is a UTC
      // day and toUTCString is locale-independent, so '2026-09-26' reads '26 Sep 2026' for every viewer.
      const retired = data.retired_on ? new Date(data.retired_on).toUTCString().slice(5, 16) : null;
      return (
        <div className="bg-ground-alt border border-hairline rounded-lg p-4 md:p-5" style={{ border: '1px solid var(--hairline)' }}>
          {retired && (
            <div className="text-xs mb-4" style={{ color: 'var(--secondary)' }}>
              Retired on {retired}: no new attestations are written; past ones stay on chain.
            </div>
          )}
          <div className="flex flex-wrap items-center gap-x-3 mb-4 text-xs" style={{ color: 'var(--secondary)' }}>
            <span>Attestor:&nbsp;
              <a href={`https://basescan.org/address/${data.attestor}`} target="_blank" rel="noreferrer"
                 className="inline-flex items-center min-h-[44px] md:min-h-0"
                 style={{ color: 'var(--accent)', fontFamily: 'IBM Plex Mono,monospace' }}>
                {(data.attestor || '').slice(0, 10)}…{(data.attestor || '').slice(-6)}
              </a>
            </span>
            <span>Total recent: <strong style={{ color: 'var(--ink)' }}>{summary.total_recent || 0}</strong></span>
            <a href={data.explorer || '#'} target="_blank" rel="noreferrer"
               className="inline-flex items-center min-h-[44px] md:min-h-0" style={{ color: 'var(--accent)' }}>View on EAS Scan ↗</a>
          </div>
          {list.length === 0 ? (
            <div className="text-center py-8 text-sm" style={{ color: 'var(--secondary)' }}>
              {retired ? 'No attestations on record.' : 'No attestations yet.'}
            </div>
          ) : (
            <div className="space-y-2">
              {list.map((a) => (
                <div key={a.uid} className="flex flex-wrap md:flex-nowrap items-center gap-x-3 py-2 px-3 rounded-lg"
                     style={{ background: 'var(--ground-alt)', border: '1px solid var(--hairline)' }}>
                  <span className="text-xs font-bold px-2 py-1 rounded"
                        style={{ background: riskColor(a.risk_label) + '22', color: riskColor(a.risk_label) }}>
                    {a.risk_label}
                  </span>
                  <span className="text-xs" style={{ color: 'var(--secondary)' }}>{a.scan_type}</span>
                  <span className="text-xs font-mono" style={{ color: 'var(--ink)' }}>
                    {(a.scanned_address || '').slice(0, 8)}…{(a.scanned_address || '').slice(-6)}
                  </span>
                  <span className="text-xs" style={{ color: 'var(--secondary)' }}>via {chainName(a.source_chain_id)}</span>
                  <span className="text-xs ml-auto" style={{ color: 'var(--secondary)' }}>
                    {a.timestamp ? new Date(a.timestamp * 1000).toLocaleString() : ''}
                  </span>
                  <a href={`https://base.easscan.org/attestation/view/${a.uid}`} target="_blank" rel="noreferrer"
                     className="text-xs inline-flex items-center justify-center min-h-[44px] min-w-[44px] md:min-h-0 md:min-w-0"
                     style={{ color: 'var(--accent)' }}>EAS ↗</a>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // A section with an id is a link target; the margin keeps its title out from under the sticky header.
    function Section({ id, title, children }) {
      return (
        <section id={id} style={id ? { scrollMarginTop:96 } : undefined}>
          <h2 className="text-sm font-semibold uppercase tracking-widest mb-3"
              style={{ color:'var(--secondary)' }}>{title}</h2>
          {children}
        </section>
      );
    }

    // ─── Header ───────────────────────────────────────────────────────────────
    const HEALTH = {
      connecting: { color:'var(--secondary)', label:'CONNECTING' },
      live:       { color:'var(--secondary)', label:'LIVE' },
      degraded:   { color:'var(--secondary)', label:'PARTIAL DATA' },
      contracts:  { color:'var(--secondary)', label:'CONTRACTS ONLY' },
      offline:    { color:'var(--secondary)', label:'OFFLINE' },
    };

    function Header({ lastUpdated, health, isLight, onToggleTheme }) {
      const h = HEALTH[health];

      return (
        <header className="bg-ground-alt border border-hairline border-b px-5 md:px-8 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-2 md:gap-3 md:sticky md:top-0"
                style={{ borderColor:'var(--hairline)', zIndex:40 }}>
          <div>
            <div className="flex items-center gap-3 flex-wrap">
              <h1 className="flex items-center gap-3">
                <span className="text-lg font-bold" style={{ color:'var(--ink)' }}>ShieldBot</span>
                <span className="text-sm" style={{ color:'var(--secondary)' }}>Threat Dashboard</span>
              </h1>
              <div className="flex items-center gap-1.5">
                <div style={{ width:8, height:8, borderRadius:'50%', background:h.color }} />
                <span className="text-xs font-semibold" style={{ color:h.color }}>{h.label}</span>
              </div>
            </div>
            <div className="text-xs mt-0.5" style={{ color:'var(--secondary)' }}>
              Robinhood Chain launch scans, firewall detections and mempool alerts · refreshes every {REFRESH_MS / 1000} seconds, launches and campaigns every {SLOW_REFRESH_MS / 60000} minutes
            </div>
          </div>
          <div className="flex items-center gap-4">
            <a href="https://shieldbotsecurity.online" className="flex items-center min-h-[44px] md:min-h-0"
               style={{ color:'var(--secondary)', fontSize:'0.75rem', textDecoration:'none', gap:'0.25rem' }}
               onMouseOver={e => e.currentTarget.style.color='var(--ink)'}
               onMouseOut={e => e.currentTarget.style.color='var(--secondary)'}>
              ← Home
            </a>
            <a href="mailto:support@shieldbotsecurity.online" className="flex items-center min-h-[44px] md:min-h-0"
               style={{ color:'var(--secondary)', fontSize:'0.75rem', textDecoration:'none' }}
               onMouseOver={e => e.currentTarget.style.color='var(--ink)'}
               onMouseOut={e => e.currentTarget.style.color='var(--secondary)'}>
              Support
            </a>
            <div className="text-xs font-mono" style={{ color:'var(--secondary)', fontFamily:'IBM Plex Mono,monospace' }}>
              {lastUpdated ? '↻ ' + timeAgo(lastUpdated / 1000) : 'Connecting…'}
            </div>
            <button className="theme-switch" type="button" role="switch" aria-checked={isLight}
                    aria-label="Light theme" title="Light theme" onClick={onToggleTheme}>
              {isLight
                ? <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                    <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z" />
                  </svg>
                : <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4" />
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l-1.42-1.42m11.3-11.3 1.42-1.42" />
                  </svg>
              }
            </button>
          </div>
        </header>
      );
    }

    // Overview counters keep their windows and sources together.
    const OVERVIEW_ITEMS = [
      { key:'contracts_scanned_24h', label:'Contracts Scanned', span:'last 24 h - extension and agent firewalls' },
      { key:'threats_detected_24h', label:'Contract Threats', span:'last 24 h' },
      { key:'transactions_blocked_24h', label:'Transactions Blocked', span:'last 24 h' },
      { key:'transactions_monitored', label:'Transactions Monitored', span:'since monitor start' },
    ];

    function StatCard({ label, span, value, color, loading, asOf, missing = '—' }) {
      const display = value == null ? 0 : value;
      return (
        <div className="bg-ground-alt border border-hairline rounded-lg p-4 fade-up flex flex-col gap-1 text-center"
             style={{ border:'1px solid var(--hairline)', minWidth:0 }}>
          {loading
            ? <div className="text-sm text-secondary">Loading</div>
             : <div className={`${value == null ? 'text-base' : 'text-2xl'} font-bold leading-none tabular-nums`}
                   style={{ color: value == null ? 'var(--secondary)' : color }}>
                {value == null ? missing : display.toLocaleString()}
              </div>
          }
          <div className="text-xs font-medium mt-1" style={{ color:'var(--secondary)' }}>{label}</div>
          <div className="text-xs" style={{ color:'var(--secondary)' }}>{span}</div>
          <div className="text-xs" style={{ color:'var(--secondary)' }}>as of {asOf ? timeAgo(asOf / 1000) : '—'}</div>
        </div>
      );
    }

    function OverviewStats({ stats, loading, asOf }) {
      const since = stats && stats.mempool_counting_since;
      const unavailable = Boolean(stats && stats.background_workers_note);
      const missing = key => key === 'transactions_monitored' && unavailable ? 'Unavailable' : '—';
      return (
        <div>
          <div className="grid grid-cols-2 xl:grid-cols-4 gap-3">
            {OVERVIEW_ITEMS.map(item => (
              <StatCard key={item.key} label={item.label} span={item.span}
                        value={stats ? stats[item.key] : null} color="var(--ink)"
                        loading={loading} asOf={asOf} missing={missing(item.key)} />
            ))}
          </div>
          {!loading && (
            <div className="text-xs mt-3 max-w-[80ch]" style={{ color:'var(--secondary)' }}>
              Contracts scanned covers the extension and agent firewalls only; Telegram, /api/scan and Robinhood Chain launch scans are not included.
              A contract threat is its latest high-risk score; a rescan replaces the previous score. A last-24-hour count uses the scan time.
              {since && ` Transactions monitored are counted since ${new Date(since * 1000).toLocaleString()}.`}
              {unavailable && ' The mempool monitor runs in a separate process this API cannot read, so its count is unavailable, not zero.'}
              {stats === null && ' Statistics are unavailable right now.'}
            </div>
          )}
        </div>
      );
    }

    // Application root follows.

    const NO_ATTESTATIONS = { available: false, attestations: [], summary: {} };

    // Rejects on any non-2xx status, so an error body is never shown as data.
    function getJSON(path) {
      return fetch(`${API}${path}`).then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
      });
    }

    function byNewest(a, b) {
      return (b.detected_at || b.created_at || 0) - (a.detected_at || a.created_at || 0);
    }

    // The newer list first; a launch on both lists is kept from it.
    function mergeLaunches(newer, older) {
      const seen = new Set(newer.map(l => l.token_address));
      return newer.concat(older.filter(l => !seen.has(l.token_address)));
    }

    function readChartColors() {
      const root = getComputedStyle(document.documentElement);
      return {
        accent: root.getPropertyValue('--accent').trim(),
        accentTint: root.getPropertyValue('--accent-tint').trim(),
        groundAlt: root.getPropertyValue('--ground-alt').trim(),
        hairline: root.getPropertyValue('--hairline').trim(),
        hairlineStrong: root.getPropertyValue('--hairline-strong').trim(),
        ink: root.getPropertyValue('--ink').trim(),
        secondary: root.getPropertyValue('--secondary').trim(),
      };
    }

    function App() {
      const [threats,   setThreats]   = useState([]);
      const [feedOk,    setFeedOk]    = useState(true);
      const [capped,    setCapped]    = useState([]);
      const [campaigns, setCampaigns] = useState([]);
      const [launches,  setLaunches]  = useState([]);
      const [slowLoading, setSlowLoading] = useState(true);
      // The next page of blocked launches, null once the loaded list is every one on record.
      const [launchCursor, setLaunchCursor] = useState(null);
      const [loadingOlder, setLoadingOlder] = useState(false);
      const [olderError,   setOlderError]   = useState(null);
      // Once older pages are loaded, a refresh keeps them and its cursor stays the deepest one.
      const olderLoaded = useRef(false);
      const [stats,     setStats]     = useState(null);
      const [loading,   setLoading]   = useState(true);
      const [error,     setError]     = useState(null);
      const [mempoolUnavailable, setMempoolUnavailable] = useState(null);
      const [updated,   setUpdated]   = useState(null);
      const [health,    setHealth]    = useState('connecting');
      const [chain,     setChain]     = useState('');
      const [isLight, setIsLight] = useState(() => document.documentElement.dataset.theme === 'light');
      const [chartColors, setChartColors] = useState(readChartColors);
      const [statsUpdated, setStatsUpdated] = useState(null);

      const toggleTheme = () => {
        const light = !isLight;
        if (light) document.documentElement.setAttribute('data-theme', 'light');
        else document.documentElement.removeAttribute('data-theme');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', light ? '#FFFFFF' : '#0B0B0A');
        localStorage.setItem('sb-theme', light ? 'light' : 'dark');
        setIsLight(light);
        setChartColors(readChartColors());
      };

      const [baseAttestations, setBaseAttestations] = useState(NO_ATTESTATIONS);

      const fetchData = useCallback(async () => {
        try {
          // Contract detections and mempool alerts are fetched separately so that frequent
          // mempool alerts cannot push contract detections out of a shared limit.
          // /api/stats also carries the mempool counters, so /api/mempool/stats is not fetched.
          const results = await Promise.allSettled([
            getJSON(`/api/threats/feed?source=contracts&limit=${FEED_LIMIT}`),
            getJSON(`/api/threats/feed?source=mempool&limit=${FEED_LIMIT}`),
            getJSON('/api/stats'),
            getJSON('/api/base/attestations?limit=20'),
          ]);
          const [fc, fm, p, b] = results;

          const feeds = [['contract detections', fc], ['mempool alerts', fm]];
          const loaded = feeds.filter(([, x]) => x.status === 'fulfilled');
          const failed = feeds.filter(([, x]) => x.status === 'rejected');
          // With no feed loaded there is nothing to count: the tiles and charts say so instead of 0.
          setThreats(loaded.flatMap(([, x]) => x.value.threats || []).sort(byNewest));
          setFeedOk(loaded.length > 0);
          // A source that returned its limit may hold more; its oldest loaded item is as far back as it reaches.
          setCapped(loaded
            .filter(([, x]) => (x.value.threats || []).length >= FEED_LIMIT)
            .map(([name, x]) => {
              // An item without a time leaves how far back its source reaches unknown, never 1970.
              const times = x.value.threats.map(t => t.detected_at || t.created_at);
              return { name, since: times.every(Boolean) ? Math.min(...times) : null };
            }));
          if (loaded.length) setUpdated(Date.now());
          setError(failed.length
            ? 'Failed to load ' + failed.map(([name, x]) => `${name} (${x.reason?.message || 'unknown error'})`).join(' and ')
            : null);
          // A mempool feed this API cannot read says why in mempool_unavailable: its empty list is not "no threats".
          const mempoolReason = fm.status === 'fulfilled' ? fm.value.mempool_unavailable || null : null;
          setMempoolUnavailable(mempoolReason);

          setStats(p.status === 'fulfilled' ? p.value : null);
          if (p.status === 'fulfilled') setStatsUpdated(Date.now());
          setBaseAttestations(b.status === 'fulfilled' ? b.value : NO_ATTESTATIONS);

          // A mempool the API runs in a separate process on purpose (background_workers_note) is a steady
          // state, not a failure: the header says CONTRACTS ONLY. Any other unavailable source is partial data.
          const workersExternal = p.status === 'fulfilled' && Boolean(p.value.background_workers_note);
          const failures = results.filter(x => x.status === 'rejected').length
            + (mempoolReason && !workersExternal ? 1 : 0);
          setHealth(failures === results.length ? 'offline'
            : failures ? 'degraded'
            : workersExternal ? 'contracts' : 'live');
        } finally {
          setLoading(false);
        }
      }, []);

      useEffect(() => {
        fetchData();
        const id = setInterval(fetchData, REFRESH_MS);
        return () => clearInterval(id);
      }, [fetchData]);

      // The slow cycle: blocked launches and campaigns. Null launches or campaigns are unavailable, never
      // "none"; a failed fetch never blanks the page. A launches refresh re-reads the newest page only:
      // with no older page loaded it replaces the list, so a launch a recheck cleared drops out;
      // otherwise it is merged ahead of the pages the reader loaded.
      const fetchSlow = useCallback(async () => {
        try {
          const [l, c] = await Promise.allSettled([
            getJSON(`/api/launches/${LAUNCH_CHAIN}?outcome=blocked&limit=${LAUNCH_LIMIT}`),
            getJSON('/api/campaigns/top?limit=10'),
          ]);
          if (l.status === 'fulfilled') {
            const page = l.value.launches || [];
            setLaunches(prev => olderLoaded.current ? mergeLaunches(page, prev) : page);
            if (!olderLoaded.current) setLaunchCursor(l.value.next_cursor || null);
            setOlderError(null);
          } else {
            setLaunches(null);
          }
          setCampaigns(c.status === 'fulfilled' ? (c.value.campaigns || []) : null);
        } finally {
          setSlowLoading(false);
        }
      }, []);

      useEffect(() => {
        fetchSlow();
        const id = setInterval(fetchSlow, SLOW_REFRESH_MS);
        return () => clearInterval(id);
      }, [fetchSlow]);

      // One request per click, outside both refresh cycles. A failed page keeps the rows already shown.
      const loadOlder = useCallback(async () => {
        setLoadingOlder(true);
        setOlderError(null);
        try {
          const reply = await getJSON(
            `/api/launches/${LAUNCH_CHAIN}?outcome=blocked&limit=${LAUNCH_LIMIT}&cursor=${encodeURIComponent(launchCursor)}`);
          olderLoaded.current = true;
          setLaunches(prev => mergeLaunches(prev || [], reply.launches || []));
          setLaunchCursor(reply.next_cursor || null);
        } catch (e) {
          setOlderError(`Older launches not loaded (${e.message}).`);
        } finally {
          setLoadingOlder(false);
        }
      }, [launchCursor]);

      // The slow sources count for the header's health as they did when fetched with the others: one that
      // failed is partial data, and a page whose fast sources all failed is offline only once both have
      // failed too. Until the slow cycle has answered once, the fast cycle's health stands.
      const slowFailed = [launches, campaigns].filter(x => x === null).length;
      const shownHealth = slowLoading || health === 'connecting' ? health
        : slowFailed ? (health === 'offline' && slowFailed === 2 ? 'offline' : 'degraded')
        : health === 'offline' ? 'degraded' : health;

      const velocityData = useMemo(() => bucketByHour(threats),    [threats]);
      const chainData    = useMemo(() => chainDist(threats),        [threats]);

      return (
        <div style={{ minHeight:'100vh', background:'var(--ground)' }}>
          <Header lastUpdated={updated} health={shownHealth} isLight={isLight} onToggleTheme={toggleTheme} />

          <main className="px-4 md:px-8 py-6 space-y-8 mx-auto" style={{ maxWidth:1600 }}>

            <Section id="robinhood-chain" title="Robinhood Chain">
              <RobinhoodPanel launches={launches} launchesLoading={slowLoading} cursor={launchCursor}
                              onLoadOlder={loadOlder} loadingOlder={loadingOlder} olderError={olderError} />
            </Section>

            <Section title="Overview">
              <OverviewStats stats={stats} loading={loading} asOf={statsUpdated} />
            </Section>

            <Section title="Provider Answers">
              <ProviderAnswersPanel stats={stats} loading={loading} asOf={statsUpdated} />
            </Section>

            <Section title="Live Threat Feed">
              <div className="bg-ground-alt border border-hairline rounded-lg p-4 md:p-5" style={{ border:'1px solid var(--hairline)' }}>
                <div className="text-xs mb-3" style={{ color:'var(--secondary)' }}>
                  The newest {FEED_LIMIT} contract detections and the newest {FEED_LIMIT} mempool alerts, so the
                  feed and the charts below it are not counts. Contract detections come from the extension and
                  agent firewalls; Robinhood Chain launch scans are in the{' '}
                  <a href="#robinhood-chain" style={{ color:'var(--accent)' }}>Robinhood Chain panel</a>.
                </div>
                <ThreatLogTable
                  threats={threats} launches={launches} loading={loading} error={error} mempoolUnavailable={mempoolUnavailable}
                  onRetry={fetchData} chain={chain} onChain={setChain}
                />
              </div>
            </Section>

            <Section title="Feed Analytics">
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                <ThreatVelocityChart data={velocityData} loading={loading} unavailable={!feedOk} capped={capped} colors={chartColors} asOf={updated} />
                <ChainDistributionChart data={chainData} loading={loading} unavailable={!feedOk} capped={capped} colors={chartColors} asOf={updated} />
              </div>
            </Section>

            <Section title="Top Campaigns">
              <CampaignsGrid campaigns={campaigns} loading={slowLoading} />
              {!slowLoading && (
                <div className="text-xs mt-2" style={{ color:'var(--secondary)' }}>
                  Deployers with the most contracts on record. This list refreshes every {SLOW_REFRESH_MS / 60000} minutes.
                </div>
              )}
            </Section>

            {baseAttestations.available && (
              <Section title="Base EAS Attestations">
                <BaseAttestationsPanel data={baseAttestations} />
              </Section>
            )}

          </main>
        </div>
      );
    }

    // ─── Mount ────────────────────────────────────────────────────────────────
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
