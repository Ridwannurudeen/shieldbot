<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShieldBot Threat Dashboard</title>
  <meta name="description" content="ShieldBot's public threat dashboard: the newest high-risk contract detections and mempool alerts, with platform statistics and the window each count covers." />
  <link rel="canonical" href="https://api.shieldbotsecurity.online/dashboard" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iNiIgZmlsbD0iIzBGMTcyQSIvPjxwYXRoIGQ9Ik0xNiAzTDI3IDcuNVYxNUMyNyAyMS41IDE2IDI5IDE2IDI5QzE2IDI5IDUgMjEuNSA1IDE1VjcuNUwxNiAzWiIgZmlsbD0iIzNCODJGNiIvPjxwYXRoIGQ9Ik0xNiA3TDIzIDEwVjE1QzIzIDE5IDE2IDI0IDE2IDI0QzE2IDI0IDkgMTkgOSAxNVYxMEwxNiA3WiIgZmlsbD0iIzBGMTcyQSIvPjxwb2x5bGluZSBwb2ludHM9IjEyLDE1IDE1LDE4IDIwLDEzIiBmaWxsPSJub25lIiBzdHJva2U9IiMxMEI5ODEiIHN0cm9rZS13aWR0aD0iMi4yIiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiLz48L3N2Zz4=" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
        },
      },
    };
  </script>

  <!-- React + ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- prop-types (required by Recharts UMD) -->
  <script src="https://unpkg.com/prop-types@15/prop-types.min.js" crossorigin></script>

  <!-- Recharts -->
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js" crossorigin></script>

  <!-- Babel (JSX in browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0F172A;
      font-family: 'Inter', system-ui, sans-serif;
      color: #F8FAFC;
      min-height: 100vh;
    }

    .glass {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* Skeleton shimmer */
    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, #1E293B 25%, #2D3F55 50%, #1E293B 75%);
      background-size: 400px 100%;
      animation: shimmer 1.4s infinite linear;
      border-radius: 6px;
    }

    /* Toast slide-in */
    @keyframes slideInRight {
      from { transform: translateX(110%); opacity: 0; }
      to   { transform: translateX(0);   opacity: 1; }
    }
    .toast-anim { animation: slideInRight 0.25s ease; }

    /* Fade in */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.2s ease both; }

    /* CRITICAL badge pulse glow */
    @keyframes critPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.5); }
      50%       { box-shadow: 0 0 0 5px rgba(239,68,68,0); }
    }
    .badge-critical { animation: critPulse 2s infinite; }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .skeleton    { animation: none; background: #1E293B; }
      .toast-anim  { animation: none; }
      .fade-up     { animation: none; }
      .badge-critical { animation: none; }
      *, *::before, *::after { transition: none !important; }
    }

    :focus-visible { outline: 2px solid #60A5FA; outline-offset: 2px; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #1E293B; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo, useRef } = React;
    const {
      AreaChart, Area, BarChart, Bar, Cell,
      XAxis, YAxis, CartesianGrid, Tooltip,
      ResponsiveContainer,
    } = Recharts;

    // ─── Constants ────────────────────────────────────────────────────────────
    const API              = window.location.origin;
    const REFRESH_MS       = 20000;
    // Items requested from each threat feed source; a source that returns this many may hold more.
    const FEED_LIMIT       = 100;
    // With reduced motion, counts show their value at once, the live dot does not pulse and charts do not animate.
    const REDUCED_MOTION   = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Mirrors utils/chain_info.py.
    const CHAIN_NAMES  = { 56:'BNB', 1:'ETH', 8453:'Base', 42161:'ARB', 137:'Polygon', 10:'OP', 204:'opBNB', 4663:'Robinhood' };
    const CHAIN_COLORS = { 56:'#F0B90B', 1:'#627EEA', 8453:'#0052FF', 42161:'#28A0F0', 137:'#8247E5', 10:'#FF0420', 204:'#F0B90B', 4663:'#84CC16' };
    const EXPLORERS    = { 56:'https://bscscan.com', 1:'https://etherscan.io', 8453:'https://basescan.org', 42161:'https://arbiscan.io', 137:'https://polygonscan.com', 10:'https://optimistic.etherscan.io', 204:'https://opbnbscan.com', 4663:'https://robinhoodchain.blockscout.com' };

    // Opaque badge backgrounds, so a hovered row cannot lower the text's contrast (each is at least 4.5:1).
    const SEV = {
      CRITICAL: { bg:'#3D2D3C', text:'#F87171', border:'rgba(239,68,68,0.35)' },
      HIGH:     { bg:'#3E3B34', text:'#FBBF24', border:'rgba(245,158,11,0.35)' },
      MEDIUM:   { bg:'#223657', text:'#60A5FA', border:'rgba(59,130,246,0.35)' },
      LOW:      { bg:'#1C3F46', text:'#34D399', border:'rgba(16,185,129,0.35)' },
      UNKNOWN:  { bg:'#283447', text:'#94A3B8', border:'rgba(100,116,139,0.35)' },
    };

    // ─── Utilities ────────────────────────────────────────────────────────────
    function timeAgo(ts) {
      if (!ts) return '—';
      const d = Date.now() / 1000 - ts;
      if (d < 60)    return `${Math.floor(d)}s ago`;
      if (d < 3600)  return `${Math.floor(d/60)}m ago`;
      if (d < 86400) return `${Math.floor(d/3600)}h ago`;
      return `${Math.floor(d/86400)}d ago`;
    }

    function short(addr) {
      if (!addr) return '—';
      return addr.slice(0,6) + '…' + addr.slice(-4);
    }

    function bucketByHour(threats, hrs = 24) {
      const now = Date.now() / 1000;
      const buckets = Array(hrs).fill(0);
      threats.forEach(t => {
        const age = Math.floor((now - (t.detected_at || t.created_at || 0)) / 3600);
        if (age >= 0 && age < hrs) buckets[hrs - 1 - age]++;
      });
      return buckets.map((count, i) => {
        const d = new Date(Date.now() - (hrs - 1 - i) * 3600000);
        return { hour: String(d.getHours()).padStart(2,'0') + ':00', count };
      });
    }

    function chainDist(threats) {
      const m = {};
      threats.forEach(t => {
        const n = CHAIN_NAMES[t.chain_id] || (t.chain_id ? `Chain ${t.chain_id}` : 'Unknown');
        m[n] = (m[n] || 0) + 1;
      });
      return Object.entries(m).map(([name, count]) => ({ name, count })).sort((a,b) => b.count - a.count);
    }

    // ─── Skeletons ────────────────────────────────────────────────────────────
    function SkeletonRow() {
      return (
        <div className="flex items-center gap-4 p-4 rounded-xl"
             style={{ background:'#1E293B', border:'1px solid #334155' }}>
          <div className="skeleton" style={{ height:24, width:64, borderRadius:20 }} />
          <div className="flex-1 flex flex-col gap-2">
            <div className="skeleton" style={{ height:14, width:160 }} />
            <div className="skeleton" style={{ height:11, width:220 }} />
          </div>
          <div className="skeleton" style={{ height:12, width:72 }} />
          <div className="skeleton" style={{ height:12, width:52 }} />
        </div>
      );
    }

    // ─── Toast ────────────────────────────────────────────────────────────────
    function Toast({ msg, type = 'success', onDone }) {
      useEffect(() => { const t = setTimeout(onDone, 2200); return () => clearTimeout(t); }, []);
      const isErr = type === 'error';
      // On the body, like the Flag dialog: inside the feed's glass panel it was placed against that panel.
      return ReactDOM.createPortal(
        <div role="status" className="toast-anim fixed bottom-6 right-6 z-50 flex items-center gap-2 px-4 py-3 rounded-xl shadow-2xl"
             style={{ background:'#1E293B', border:`1px solid ${isErr ? 'rgba(239,68,68,0.35)' : '#334155'}`,
                      color: isErr ? '#F87171' : '#10B981', fontSize:13 }}>
          {isErr
            ? <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
              </svg>
            : <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24" aria-hidden="true">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
          }
          <span className="font-medium">{msg}</span>
        </div>,
        document.body,
      );
    }

    // ─── Flag Modal ───────────────────────────────────────────────────────────
    function FlagModal({ threat, onClose, onResult }) {
      const [reason,  setReason]  = useState('');
      const [sending, setSending] = useState(false);
      // Why the last report was not sent. It shows in the dialog: a toast would sit under the backdrop.
      const [failure, setFailure] = useState(null);
      const dialog = useRef(null);
      useEffect(() => { setReason(''); setFailure(null); }, [threat]);
      // The open dialog takes focus, keeps Tab inside it, closes on Escape and returns focus to the
      // control that opened it.
      useEffect(() => {
        if (!threat) return;
        const opener = document.activeElement;
        dialog.current.querySelector('textarea').focus();
        function onKey(e) {
          if (e.key === 'Escape') {
            e.preventDefault();
            onClose();
          } else if (e.key === 'Tab') {
            e.preventDefault();
            const items = [...dialog.current.querySelectorAll('button:not([disabled]), textarea')];
            const index = items.indexOf(document.activeElement);
            const next = e.shiftKey ? (index <= 0 ? items.length : index) - 1 : (index + 1) % items.length;
            items[next].focus();
          }
        }
        document.addEventListener('keydown', onKey);
        return () => { document.removeEventListener('keydown', onKey); opener.focus(); };
      }, [threat]);
      if (!threat) return null;
      const addr = threat.address || threat.target_token || '';
      const type = (threat.type || threat.alert_type || 'unknown').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
      const canSend = Boolean(addr && threat.chain_id) && !sending;

      async function submit() {
        setSending(true);
        setFailure(null);
        try {
          const r = await fetch(`${API}/api/report`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              address: addr, chainId: threat.chain_id,
              report_type: 'false_positive', reason: reason.trim() || null,
            }),
          });
          if (r.ok) { onResult('Report sent. Thank you.', 'success'); onClose(); }
          else if (r.status === 429) setFailure('Too many reports. Try again in a minute.');
          else setFailure(`Report not sent (HTTP ${r.status}).`);
        } catch (e) {
          setFailure('Report not sent: network error.');
        } finally {
          setSending(false);
        }
      }
      // Rendered on the body: inside the feed's glass panel, whose backdrop-filter contains fixed
      // elements, the backdrop covered only that panel and the dialog could sit off screen.
      return ReactDOM.createPortal(
        <div className="fixed inset-0 z-50 flex items-center justify-center"
             style={{ background:'rgba(15,23,42,0.85)', backdropFilter:'blur(6px)' }}
             onClick={onClose}>
          <div ref={dialog} role="dialog" aria-modal="true" aria-labelledby="flag-title"
               className="glass rounded-2xl p-6 w-full max-w-md mx-4 fade-up"
               style={{ border:'1px solid #334155' }}
               onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-5">
              <h2 id="flag-title" className="font-semibold text-base" style={{ color:'#F8FAFC' }}>Flag False Positive</h2>
              <button onClick={onClose} aria-label="Close"
                      className="w-11 h-11 md:w-8 md:h-8 flex items-center justify-center rounded-lg transition-colors hover:text-white"
                      style={{ color:'#94A3B8', fontSize:18, lineHeight:1 }}>✕</button>
            </div>

            <div className="space-y-2 mb-4">
              <div className="rounded-lg p-3" style={{ background:'#0F172A' }}>
                <div className="text-xs mb-1" style={{ color:'#94A3B8' }}>Threat Type</div>
                <div className="text-sm font-medium" style={{ color:'#F8FAFC' }}>{type}</div>
              </div>
              <div className="rounded-lg p-3" style={{ background:'#0F172A' }}>
                <div className="text-xs mb-1" style={{ color:'#94A3B8' }}>Address</div>
                <div className="text-xs font-mono break-all" style={{ color:'#60A5FA', fontFamily:'JetBrains Mono,monospace' }}>
                  {addr || '—'}
                </div>
              </div>
            </div>

            <textarea className="w-full rounded-lg p-3 text-sm resize-none"
                      style={{ background:'#0F172A', border:'1px solid #334155', color:'#F8FAFC',
                               height:80, fontFamily:'inherit' }}
                      maxLength={1000} value={reason} onChange={e => setReason(e.target.value)}
                      aria-label="Why is this a false positive?" placeholder="Why is this a false positive?" />

            {failure && <div role="alert" className="text-sm mt-3" style={{ color:'#FCA5A5' }}>{failure}</div>}

            <div className="flex gap-2 mt-4">
              <button onClick={onClose} className="flex-1 py-2.5 min-h-[44px] md:min-h-0 rounded-lg text-sm font-medium transition-colors"
                      style={{ background:'#334155', color:'#E2E8F0' }}>Cancel</button>
              <button onClick={submit} disabled={!canSend} className="flex-1 py-2.5 min-h-[44px] md:min-h-0 rounded-lg text-sm font-medium transition-colors"
                      style={{ background:'#2563EB', color:'#fff', opacity: canSend ? 1 : 0.5 }}>
                {sending ? 'Sending…' : 'Submit Report'}
              </button>
            </div>
          </div>
        </div>,
        document.body,
      );
    }

    // ─── Error Banner ──────────────────────────────────────────────────────────
    function ErrorBanner({ msg, onRetry }) {
      return (
        <div className="flex items-center justify-between px-4 py-3 rounded-xl mb-3 text-sm"
             style={{ background:'rgba(239,68,68,0.08)', border:'1px solid rgba(239,68,68,0.25)', color:'#FCA5A5' }}>
          <span className="flex items-center gap-2">
            <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" aria-hidden="true">
              <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
            </svg>
            {msg}
          </span>
          <button onClick={onRetry} className="ml-4 px-3 py-1 min-h-[44px] md:min-h-0 rounded-lg text-xs font-semibold transition-colors"
                  style={{ background:'rgba(239,68,68,0.18)', color:'#FCA5A5' }}>Retry</button>
        </div>
      );
    }

    // ─── Threat Row ────────────────────────────────────────────────────────────
    function ThreatRow({ t, onCopy, onFlag }) {
      const [hov, setHov] = useState(false);
      const rawSev  = (t.risk_level || t.severity || 'UNKNOWN').toUpperCase();
      const sev     = SEV[rawSev] ? rawSev : 'UNKNOWN';
      const sc      = SEV[sev];
      const type    = (t.type || t.alert_type || 'unknown').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
      const addr    = t.address || t.target_token || '';
      const chain   = CHAIN_NAMES[t.chain_id] || (t.chain_id ? `Chain ${t.chain_id}` : 'Unknown');
      const cColor  = CHAIN_COLORS[t.chain_id] || '#64748B';
      const exp     = EXPLORERS[t.chain_id] || '';
      const ts      = t.detected_at || t.created_at || 0;
      const note    = (Array.isArray(t.flags) ? t.flags : []).slice(0,2).join(', ') || t.description || '';

      return (
        <div className="rounded-xl p-4 transition-all duration-150"
             style={{
               background: hov ? '#253349' : '#1E293B',
               border: `1px solid ${hov ? '#475569' : '#334155'}`,
               transform: hov ? 'translateY(-1px)' : 'translateY(0)',
               boxShadow: hov ? '0 6px 24px rgba(0,0,0,0.35)' : 'none',
             }}
             onMouseEnter={() => setHov(true)}
             onMouseLeave={() => setHov(false)}>
          <div className="flex flex-wrap md:flex-nowrap items-start gap-3">

            {/* Severity badge */}
            <span className={`shrink-0 text-xs font-bold px-2 py-1 rounded-md uppercase tracking-wide text-center ${sev === 'CRITICAL' ? 'badge-critical' : ''}`}
                  style={{ background:sc.bg, color:sc.text, border:`1px solid ${sc.border}`, minWidth:64 }}>
              {sev}
            </span>

            {/* Content */}
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="font-semibold text-sm" style={{ color:'#F8FAFC' }}>{type}</span>
                <span className="text-xs px-2 py-0.5 rounded-full font-medium"
                      style={{ background:`${cColor}20`, color:'#E2E8F0' }}>{chain}</span>
              </div>
              {note && <div className="text-xs mt-0.5 truncate" style={{ color:'#94A3B8' }}>{note}</div>}
              <div className="text-xs mt-0.5 font-mono" style={{ color:'#60A5FA', fontFamily:'JetBrains Mono,monospace' }}>
                {addr ? short(addr) : '—'}
              </div>
            </div>

            {/* Time */}
            <div className="text-xs shrink-0" style={{ color:'#94A3B8' }}>{timeAgo(ts)}</div>

            {/* Quick actions */}
            <div className="flex items-center justify-end gap-1 shrink-0 w-full md:w-auto">

              {exp && addr && (
                <a href={`${exp}/address/${addr}`} target="_blank" rel="noopener noreferrer"
                   title="Investigate on Explorer" aria-label={`Investigate ${short(addr)} on the explorer`}
                   className="w-11 h-11 md:w-8 md:h-8 flex items-center justify-center rounded-lg transition-colors"
                   style={{ background:'rgba(59,130,246,0.15)', color:'#60A5FA' }}
                   onClick={e => e.stopPropagation()}>
                  <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                  </svg>
                </a>
              )}

              {addr && (
                <button title="Copy Address" aria-label={`Copy ${short(addr)} to the clipboard`}
                        className="w-11 h-11 md:w-8 md:h-8 flex items-center justify-center rounded-lg transition-colors"
                        style={{ background:'rgba(16,185,129,0.15)', color:'#34D399' }}
                        onClick={() => onCopy(addr)}>
                  <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="9" y="9" width="13" height="13" rx="2"/>
                    <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
                  </svg>
                </button>
              )}

              <button title="Flag False Positive" aria-label={`Flag ${addr ? short(addr) : type} as a false positive`}
                      className="w-11 h-11 md:w-8 md:h-8 flex items-center justify-center rounded-lg transition-colors"
                      style={{ background:'rgba(245,158,11,0.15)', color:'#FBBF24' }}
                      onClick={() => onFlag(t)}>
                <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
                  <line x1="4" y1="22" x2="4" y2="15"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ─── Threat Log Table ─────────────────────────────────────────────────────
    const CHAIN_FILTERS = [
      { label:'All Chains', val:'' },
      { label:'BNB',        val:'56' },
      { label:'ETH',        val:'1' },
      { label:'Base',       val:'8453' },
      { label:'Arbitrum',   val:'42161' },
      { label:'Polygon',    val:'137' },
      { label:'Optimism',   val:'10' },
      { label:'opBNB',      val:'204' },
      { label:'Robinhood',  val:'4663' },
    ];

    function threatKey(t) {
      return [t.type, t.chain_id, t.address || t.target_token || '', t.victim_tx || t.attacker_tx || '',
              t.detected_at || t.created_at || ''].join(':');
    }

    function ThreatLogTable({ threats, loading, error, mempoolUnavailable, onRetry, chain, onChain }) {
      const [toast, setToast] = useState(null);
      const [flag,  setFlag]  = useState(null);

      const filtered = chain ? threats.filter(t => String(t.chain_id) === chain) : threats;

      function handleCopy(addr) {
        navigator.clipboard.writeText(addr)
          .then(() => setToast({ msg:'Address copied to clipboard', type:'success' }))
          .catch(() => setToast({ msg:'Failed to copy — try manually', type:'error' }));
      }

      return (
        <div>
          {/* Chain filter pills */}
          <div className="flex gap-2 flex-wrap mb-4">
            {CHAIN_FILTERS.map(f => {
              const active = chain === f.val;
              return (
                <button key={f.val} onClick={() => onChain(f.val)} aria-pressed={active}
                        className="px-3 py-1.5 min-h-[44px] md:min-h-0 rounded-lg text-xs font-medium transition-all duration-150"

    // ─── Platform Stats Bar ────────────────────────────────────────────────────
    // Every count on the page comes from /api/stats; each says the window it covers.
    const STAT_ITEMS = [
      { key:'transactions_monitored', label:'Transactions Monitored', span:'since monitor start', color:'#3B82F6' },
      { key:'contracts_scanned',      label:'Contracts Scanned',      span:'all time',            color:'#10B981' },

      { key:'transactions_blocked',   label:'Transactions Blocked',   span:'all time',            color:'#F59E0B' },
      { key:'sandwiches_caught',      label:'Sandwich Attacks Caught',span:'since monitor start', color:'#8B5CF6' },
      { key:'suspicious_approvals',   label:'Suspicious Approvals',   span:'since monitor start', color:'#F97316' },
      { key:'chains_protected',       label:'Mempool Chains Watched', span:'last poll',           color:'#06B6D4' },
    ];

    const DAY_ITEMS = [
      { key:'contracts_scanned_24h',    label:'Contracts Scanned',    span:'last 24 h', color:'#10B981' },
      { key:'threats_detected_24h',     label:'Contract Threats',     span:'last 24 h', color:'#EF4444' },
      { key:'transactions_blocked_24h', label:'Transactions Blocked', span:'last 24 h', color:'#F59E0B' },
    ];

    function useCountUp(target, duration = 1200) {
      const [display, setDisplay] = useState(0);
      const shown = useRef(0);
      useEffect(() => {
        if (!target || REDUCED_MOTION) { shown.current = target; setDisplay(target); return; }
        const start = Date.now();
        const from = shown.current;
        let frame;
        const tick = () => {
          const elapsed = Date.now() - start;
          const progress = Math.min(elapsed / duration, 1);
          const eased = 1 - Math.pow(1 - progress, 3);
          const next = Math.round(from + (target - from) * eased);
          shown.current = next;
          setDisplay(next);
          if (progress < 1) frame = requestAnimationFrame(tick);
        };
        frame = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(frame);
      }, [target]);
      return display;
    }

    // A null count is unknown, never 0. A background_workers_note says the mempool monitor runs in a separate
    // process this API does not read, so its counts are Unavailable; otherwise a dash means not reporting.
    function missingText(stats) {
      return stats && stats.background_workers_note ? 'Unavailable' : '—';
    }

    function StatCard({ label, span, value, color, loading, note, missing, className = '' }) {
      const display = useCountUp(loading || value == null ? 0 : value);
      return (
        <div className={`glass rounded-xl p-4 fade-up flex flex-col gap-1 text-center ${className}`}

          }

          <div className="text-xs" style={{ color:'#94A3B8' }}>{span}</div>
          {note && <div className="text-xs" style={{ color:'#94A3B8' }}>{note}</div>}
        </div>
      );
    }

    function PlatformStatsBar({ stats, loading }) {
      const since = stats && stats.mempool_counting_since;
      const anyMissing = stats && STAT_ITEMS.some(s => stats[s.key] == null);
      // A monitored chain whose mempool could not be read is Unknown; it is not counted as watched.
      const unobservable = (stats && stats.mempool_chains_unobservable) || [];

        <div>

                        className={s.key === 'chains_protected' ? 'col-span-2 lg:col-span-1' : ''} />

          {!loading && (stats === null || since || anyMissing) && (
            <div className="text-xs mt-2" style={{ color:'#94A3B8' }}>
              {stats === null
                ? 'Platform statistics are unavailable right now.'
                : stats.background_workers_note
                  ? 'Unavailable: the mempool monitor runs in a separate process that this API does not read, so its counts are unknown here, not zero.'
                  : since
                  ? `Transactions monitored, sandwich attacks and suspicious approvals are counted since ${new Date(since * 1000).toLocaleString()}, when the mempool monitor last started.`
                  : 'A dash means that source is not reporting right now.'}

            window. The charts and the feed below show only the newest

    // ─── App ──────────────────────────────────────────────────────────────────
    const NO_ATTESTATIONS = { available: false, attestations: [], summary: {} };

    // Rejects on any non-2xx status, so an error body is never shown as data.
    function getJSON(path) {
      return fetch(`${API}${path}`).then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
      });
    }

    function byNewest(a, b) {
      return (b.detected_at || b.created_at || 0) - (a.detected_at || a.created_at || 0);
    }

    function App() {
      const [threats,   setThreats]   = useState([]);
      const [feedOk,    setFeedOk]    = useState(true);
      const [capped,    setCapped]    = useState([]);
      const [campaigns, setCampaigns] = useState([]);
      const [stats,     setStats]     = useState(null);
      const [loading,   setLoading]   = useState(true);
      const [error,     setError]     = useState(null);
      const [mempoolUnavailable, setMempoolUnavailable] = useState(null);
      const [updated,   setUpdated]   = useState(null);
      const [health,    setHealth]    = useState('connecting');
      const [chain,     setChain]     = useState('');

      const [baseAttestations, setBaseAttestations] = useState(NO_ATTESTATIONS);

      const fetchData = useCallback(async () => {
        try {
          // Contract detections and mempool alerts are fetched separately so that frequent
          // mempool alerts cannot push contract detections out of a shared limit.
          // /api/stats also carries the mempool counters, so /api/mempool/stats is not fetched.
          const results = await Promise.allSettled([
            getJSON(`/api/threats/feed?source=contracts&limit=${FEED_LIMIT}`),
            getJSON(`/api/threats/feed?source=mempool&limit=${FEED_LIMIT}`),
            getJSON('/api/campaigns/top?limit=10'),
            getJSON('/api/stats'),
            getJSON('/api/base/attestations?limit=20'),
          ]);
          const [fc, fm, c, p, b] = results;

          const feeds = [['contract detections', fc], ['mempool alerts', fm]];
          const loaded = feeds.filter(([, x]) => x.status === 'fulfilled');
          const failed = feeds.filter(([, x]) => x.status === 'rejected');
          // With no feed loaded there is nothing to count: the tiles and charts say so instead of 0.
          setThreats(loaded.flatMap(([, x]) => x.value.threats || []).sort(byNewest));
          setFeedOk(loaded.length > 0);
          // A source that returned its limit may hold more; its oldest loaded item is as far back as it reaches.
          setCapped(loaded
            .filter(([, x]) => (x.value.threats || []).length >= FEED_LIMIT)
            .map(([name, x]) => {
              // An item without a time leaves how far back its source reaches unknown, never 1970.
              const times = x.value.threats.map(t => t.detected_at || t.created_at);
              return { name, since: times.every(Boolean) ? Math.min(...times) : null };
            }));
          if (loaded.length) setUpdated(Date.now());
          setError(failed.length
            ? 'Failed to load ' + failed.map(([name, x]) => `${name} (${x.reason?.message || 'unknown error'})`).join(' and ')
            : null);
          // A mempool feed this API cannot read says why in mempool_unavailable: its empty list is not "no threats".
          const mempoolReason = fm.status === 'fulfilled' ? fm.value.mempool_unavailable || null : null;
          setMempoolUnavailable(mempoolReason);

          setCampaigns(c.status === 'fulfilled' ? (c.value.campaigns || []) : null);
          setStats(p.status === 'fulfilled' ? p.value : null);
          setBaseAttestations(b.status === 'fulfilled' ? b.value : NO_ATTESTATIONS);

          const failures = results.filter(x => x.status === 'rejected').length + (mempoolReason ? 1 : 0);
          setHealth(failures === 0 ? 'live' : failures === results.length ? 'offline' : 'degraded');
        } finally {
          setLoading(false);
        }
      }, []);

      useEffect(() => {
        fetchData();
        const id = setInterval(fetchData, REFRESH_MS);
        return () => clearInterval(id);
      }, [fetchData]);

      const velocityData = useMemo(() => bucketByHour(threats),    [threats]);
      const chainData    = useMemo(() => chainDist(threats),        [threats]);

      return (
        <div style={{ minHeight:'100vh', background:'#0F172A' }}>
          <Header lastUpdated={updated} health={health} />

          <main className="px-4 md:px-8 py-6 space-y-8 mx-auto" style={{ maxWidth:1600 }}>

            <Section title="Platform Statistics">
              <PlatformStatsBar stats={stats} loading={loading} />
            </Section>

            <Section title="Last 24 Hours">
              <LastDayBar stats={stats} loading={loading} />
            </Section>

            <Section title="Analytics">
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                <ThreatVelocityChart data={velocityData} unavailable={!feedOk} capped={capped} />
                <ChainDistributionChart data={chainData} loading={loading} unavailable={!feedOk} capped={capped} />
              </div>
            </Section>

            <Section title="Live Threat Feed">
              <div className="glass rounded-xl p-4 md:p-5" style={{ border:'1px solid #334155' }}>
                <div className="text-xs mb-3" style={{ color:'#94A3B8' }}>
                  The newest {FEED_LIMIT} contract detections and the newest {FEED_LIMIT} mempool alerts.
                </div>
                <ThreatLogTable
                  threats={threats} loading={loading} error={error} mempoolUnavailable={mempoolUnavailable}
                  onRetry={fetchData} chain={chain} onChain={setChain}
                />
              </div>
            </Section>

            <Section title="Top Campaigns">
              <CampaignsGrid campaigns={campaigns} loading={loading} />
            </Section>

            {baseAttestations.available && (
              <Section title="Base EAS Attestations">
                <BaseAttestationsPanel data={baseAttestations} />
              </Section>
            )}

          </main>
        </div>
      );
    }

    // ─── Mount ────────────────────────────────────────────────────────────────
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
