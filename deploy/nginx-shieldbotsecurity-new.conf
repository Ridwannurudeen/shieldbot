server {
    server_name shieldbotsecurity.online www.shieldbotsecurity.online;
    root /opt/shieldbot/landing;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src https://www.youtube.com; connect-src 'self' https://api.shieldbotsecurity.online; font-src 'self';" always;

    location = /dashboard {
        return 301 https://api.shieldbotsecurity.online/dashboard;
    }

    location = /dashboard/ {
        return 301 https://api.shieldbotsecurity.online/dashboard;
    }

    location /api/ {
        return 301 https://api.shieldbotsecurity.online$request_uri;
    }

    # Hardening: this site serves zero PHP/CGI. 404 exploit probes so known-malicious
    # filenames stop returning 200 (a malware/web-shell misclassification trigger).
    location ~* \.(php|phtml|php[0-9]|asp|aspx|jsp|cgi|pl|env|bak|sql|swp|old)$ {
        return 404;
    }

    # Block dotfiles (.git, .env, .htaccess) while keeping /.well-known reachable.
    location ~ /\.(?!well-known) {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/shieldbotsecurity.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shieldbotsecurity.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    include /etc/nginx/snippets/acme-challenge.conf;
    server_name shieldbotsecurity.online www.shieldbotsecurity.online;
    location / {
        return 301 https://$host$request_uri;
    }
}
