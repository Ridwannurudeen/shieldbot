server {
    server_name shieldbotsecurity.online;
    root /opt/shieldbot/landing;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src https://www.youtube.com; connect-src 'self' https://api.shieldbotsecurity.online; font-src 'self';" always;

    location = /dashboard {
        return 301 https://api.shieldbotsecurity.online/dashboard;
    }

    location = /dashboard/ {
        return 301 https://api.shieldbotsecurity.online/dashboard;
    }

    location /api/ {
        return 301 https://api.shieldbotsecurity.online$request_uri;
    }

    # Hardening: this site serves zero PHP/CGI. 404 exploit probes so known-malicious
    # filenames stop returning 200 (a malware/web-shell misclassification trigger).
    location ~* \.(php|phtml|php[0-9]|asp|aspx|jsp|cgi|pl|env|bak|sql|swp|old)$ {
        return 404;
    }

    # Block dotfiles (.git, .env, .htaccess) while keeping /.well-known reachable.
    location ~ /\.(?!well-known) {
        return 404;
    }

    # Plausible Analytics through this domain, so the Content-Security-Policy stays 'self' (landing pages load
    # /js/plausible-init.js, then /js/script.js). Replace pa-SITE_ID with the site's script name from Plausible
    # (Site settings, Site installation); until then the script answers 404 and the pages work without analytics.
    # /stats/event, not Plausible's default /api/event, because /api/ above redirects to the API host.
    location = /js/script.js {
        resolver 9.9.9.9 valid=300s;
        set $plausible_script_url https://plausible.io/js/pa-SITE_ID.js;
        proxy_pass $plausible_script_url;
        proxy_set_header Host plausible.io;
        proxy_ssl_server_name on;
        proxy_buffering on;
    }

    location = /stats/event {
        resolver 9.9.9.9 valid=300s;
        set $plausible_event_url https://plausible.io/api/event;
        proxy_pass $plausible_event_url;
        proxy_set_header Host plausible.io;
        proxy_ssl_server_name on;
        proxy_buffering on;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/shieldbotsecurity.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shieldbotsecurity.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# One canonical host: www redirects to the bare domain instead of serving a duplicate site.
server {
    server_name www.shieldbotsecurity.online;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://shieldbotsecurity.online$request_uri;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/shieldbotsecurity.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shieldbotsecurity.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    include /etc/nginx/snippets/acme-challenge.conf;
    server_name shieldbotsecurity.online www.shieldbotsecurity.online;
    location / {
        return 301 https://shieldbotsecurity.online$request_uri;
    }
}
