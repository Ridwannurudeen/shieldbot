    <!-- FAQ JSON-LD (rich results in Google) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is ShieldBot?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A transaction security tool for EVM chains. The browser extension checks transactions before you sign; the Telegram bot, API and MCP server scan contracts on 8 chains, including Robinhood Chain."
          }
        },
        {
          "@type": "Question",
          "name": "How does ShieldBot detect rug pulls and scams?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Contract code checks (including bytecode patterns for unverified contracts), market and liquidity data, on-chain reputation, honeypot checks (a buy and sell simulation where the chain has one, GoPlus flags elsewhere) and scam databases. If one of these cannot run, the result says Unknown instead of Safe."
          }
        },
        {
          "@type": "Question",
          "name": "Which blockchains does ShieldBot support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ethereum, BNB Chain, opBNB, Base, Arbitrum, Polygon, Optimism and Robinhood Chain. Contract scans run on all 8 chains. Mempool monitoring covers the 4 chains with a public mempool: Ethereum, BNB Chain, opBNB and Polygon. Missing data is reported as Unknown."
          }
        },
        {
          "@type": "Question",
          "name": "What does ShieldBot do on Robinhood Chain?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It scans Robinhood Chain tokens with a buy and sell simulation on supported pool routes, finds new launches and sends alerts in Telegram. A verdict registry, a freshness guard and a guarded transfer contract were deployed on Robinhood Chain on 27 September 2026."
          }
        },
        {
          "@type": "Question",
          "name": "How do I install ShieldBot, and what does it cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Install the extension from the Chrome Web Store. It is free and needs no account, and so is the Telegram bot at t.me/shieldbot_bnb_bot: send a contract address to get a risk report."
          }
        },
        {
          "@type": "Question",
          "name": "Does ShieldBot have a token?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. ShieldBot does not issue, sell, control or endorse any token. An earlier extension release used the BNB Chain token 0x4904c02efa081cb7685346968bac854cdf4e7777 as an access gate; that gate has been removed. Tokens using the ShieldBot name, including SBOT (named shieldbot, 0x8adba5e2f8ebe8a6f8d9f4c8151fba7ce2328900) and SHIELD (named shieldbot_, 0x7bf4c3cd40710b027282b6b85d86f75acfcbd0f1), two Robinhood Chain tokens paired with NVDA in pools opened on 15 September 2026, are not ShieldBot products."
          }
        },
        {
          "@type": "Question",
          "name": "What is the safety score?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The extension shows a safety score out of 100, where higher is safer. It is 100 minus ShieldBot's risk score. 70 or above is SAFE, 51 to 69 is CAUTION, 30 to 50 is HIGH RISK, and 29 or below is BLOCK RECOMMENDED. If a check could not run, the score shows as Unknown instead of a number."
          }
        },
        {
          "@type": "Question",
          "name": "I think I signed something bad. What now?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Revoke the approval first, in your wallet's approval settings or at revoke.cash, then move what is left to a fresh wallet and do not sign any refund or recovery offer. In Telegram, /rescue <wallet> counts your ERC-20 allowances on a chain and lists the risky ones, and /report <address> <reason> flags the address. The full steps are in the Safety guide at shieldbotsecurity.online/safety.html."
          }
        }
      ]
    }
    </script>
